---
name: 准备 dav1d 与 pkg-config（Windows 原生资产前置）
description: >-
  按 docs/windows-build/win-baseline-env.sh 的配方给 windows runner 补 dav1d/nasm/meson/ninja，
  并把 PKG_CONFIG_PATH、PKG_CONFIG、DAV1D_DLL 同时写进 job 环境与两份 cargo 配置。
# 单一真源：push-build.yml 与 release.yml 的 build-windows 都 uses 这一份。
# 起因 —— 这段配方曾在两条管路里各写一遍，release.yml 那份从来没被补上，
# 于是它的 Windows 腿连着红了两次（failed to run custom build command for `dav1d-sys v0.8.3`）。
runs:
  using: composite
  steps:
    - name: 装 dav1d 与构建依赖，写 cargo 配置
      shell: pwsh
      run: |
        # 配方出处：docs/windows-build/win-baseline-env.sh:177-210
        # native-assets hook 是 Flutter 另起的进程，环境是干净的，shell 里的 export
        # 传不到 cargo 的 build script —— PKG_CONFIG_PATH 必须写进 .cargo/config.toml
        # 的 [env] 段，否则 image 的 avif-native 挂在 dav1d-sys 的 build.rs，
        # 只报一句 "Building native assets failed"。路径一律现查，不写死。
        $vcpkg = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { $env:VCPKG_INSTALLATION_ROOT }
        if (-not $vcpkg) { "::error::runner 上没有 VCPKG_ROOT / VCPKG_INSTALLATION_ROOT"; exit 1 }
        & (Join-Path $vcpkg 'vcpkg.exe') install dav1d:x64-windows pkgconf:x64-windows
        # dav1d-sys 0.8.3 的 build.rs 不是「链接现成 dav1d」，而是解包 dav1d 源码自己编
        # （失败时日志里能看到 dav1d-1.5.4.tar.gz），x86 汇编要 nasm、配置要 meson+ninja，
        # GitHub 的 Windows 镜像这三样都没有 ⇒ 只补 pkg-config 仍然编不过。
        choco install nasm -y --no-progress
        python -m pip install --quiet --disable-pip-version-check meson ninja
        $nasmDir = Split-Path (Get-Command nasm -ErrorAction SilentlyContinue).Source
        if ($nasmDir) { Add-Content -Path $env:GITHUB_PATH -Value $nasmDir }
        $scripts = (python -c "import os,sysconfig;print(os.path.join(sysconfig.get_path('scripts')))").Trim()
        if (Test-Path $scripts) { Add-Content -Path $env:GITHUB_PATH -Value $scripts }
        "::notice::nasm=$nasmDir scripts=$scripts meson=$((Get-Command meson -ErrorAction SilentlyContinue).Source) ninja=$((Get-Command ninja -ErrorAction SilentlyContinue).Source)"
        $installed = Join-Path $vcpkg 'installed'
        # 必须优先 release：vcpkg 会把 dav1d.pc 同时放进 lib/pkgconfig 与 debug/lib/pkgconfig，
        # 早期版本这里用 -Recurse 取第一个命中，拿到了 debug 那份 ⇒ pkg-config 探不到可用库，
        # system-deps 于是回退去跑 meson（本机文档记过 meson 探测 MSVC 也会断）。
        $pcs = @(Get-ChildItem -Path $installed -Filter dav1d.pc -Recurse -ErrorAction SilentlyContinue |
                 Where-Object { $_.Directory.Name -eq 'pkgconfig' } |
                 Select-Object -ExpandProperty DirectoryName)
        $pcdir = @($pcs | Where-Object { $_ -notmatch '\\debug\\' })[0]
        if (-not $pcdir) { $pcdir = $pcs[0] }
        if (-not $pcdir) {
          "::error::装完 dav1d 仍找不到 dav1d.pc，当前 .pc 落点："
          Get-ChildItem -Path $installed -Filter '*.pc' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 20 -ExpandProperty FullName
          exit 1
        }
        $pkgconfig = Get-ChildItem -Path $installed -Include 'pkg-config.exe', 'pkgconf.exe' -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1 -ExpandProperty FullName
        if ($pkgconfig) { Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG=$pkgconfig" }
        $fwd = $pcdir -replace '\\', '/'
        # 两条都要：pkg-config-rs 先看 PKG_CONFIG，再看 PATH；vcpkg 的 pkgconf.exe 不在 PATH 上，
        # 而 native-assets 钩子的子进程环境是干净的 ⇒ 只给 PKG_CONFIG_PATH 时它会找不到可执行文件，
        # 探测失败就回退去跑 meson（实测：同一步里直连 cargo 能过，钩子里同一 crate 失败）。
        $toml = '[env]' + "`n" + 'PKG_CONFIG_PATH = { value = "' + $fwd + '", force = false }' + "`n"
        if ($pkgconfig) { $toml += 'PKG_CONFIG = { value = "' + ($pkgconfig -replace '\\','/') + '", force = false }' + "`n" }
        # 两份都要写：仓库根那份只对 cwd 在仓库内的 cargo 调用生效；
        # flutter 的 native-assets 钩子把 cargo 的 cwd 放在构建目录，够不到仓库根的 .cargo/config.toml
        # （实测：步骤里直连 `cargo build -p windcore` 能过，钩子里同一个 crate 却回退去跑 meson）。
        # 用户级 $env:USERPROFILE\.cargo\config.toml 与 cwd 无关，cargo 必读 ⇒ 钩子才拿得到 PKG_CONFIG_PATH。
        # 顺序是这里的坑：早先版本先把 $toml 写到用户级配置、再拼 $toml，$toml 那时还是空串，
        # 于是用户级配置落成一个空文件，「钩子够不到仓库根」这条路径其实一直没被覆盖。
        $userCargo = Join-Path $env:USERPROFILE '.cargo'
        New-Item -ItemType Directory -Force -Path $userCargo | Out-Null
        [IO.File]::WriteAllText((Join-Path $userCargo 'config.toml'), $toml)
        New-Item -ItemType Directory -Force -Path '.cargo' | Out-Null
        [IO.File]::WriteAllText((Join-Path (Get-Location) '.cargo/config.toml'), $toml)
        "::notice::cargo [env] 配置写入 $(Join-Path $userCargo 'config.toml') 与 .cargo/config.toml，内容长度 $($toml.Length)"
        # 光有 [env] 段不够：windows/runner/CMakeLists.txt 用 `cmake -E env` 单独调 cargo 编
        # rossi_gpu_present.dll，而 cargo 的 [env] 是按**当前工作目录**向上找配置的 —— 那次调用的
        # cwd 是构建目录，够不到仓库根这份 config.toml（该文件 126-133 行自己写明了这点）。
        # 它只在 ENV{PKG_CONFIG_PATH} 存在时才把变量递给 cargo，所以这里必须同时把它放进作业环境，
        # 否则 local_core 的 dav1d-sys 找不到 pkg-config，cargo 以 101 退出且 MSBuild 不给输出。
        Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$fwd"
        $dlls = @(Get-ChildItem -Path $installed -Filter dav1d.dll -Recurse -ErrorAction SilentlyContinue |
                 Where-Object { $_.Directory.Name -eq 'bin' } |
                 Select-Object -ExpandProperty FullName)
        $dll = @($dlls | Where-Object { $_ -notmatch '\\debug\\' })[0]
        if (-not $dll) { $dll = $dlls[0] }
        if ($dll) { Add-Content -Path $env:GITHUB_ENV -Value "DAV1D_DLL=$dll" }
        else { "::warning::未找到 dav1d.dll —— 产物会缺 AVIF 运行时依赖（构建本身不受影响）" }
        "::notice::PKG_CONFIG_PATH=$fwd / PKG_CONFIG=$pkgconfig / DAV1D_DLL=$dll"
