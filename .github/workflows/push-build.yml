  # ══════════════════════════════════════════
  # 4. macOS 构建
  # ══════════════════════════════════════════
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只有 arm64：GitHub 已不再提供 Intel 机器，标签 macos-15-intel 实际解析到 arm64 的
          # macos-15 镜像（job 日志自报 Image: macos-15），钩子于是按宿主要 aarch64-apple-darwin，
          # 而 rustup host 是 x86_64 —— pkg-config 面对真交叉合法拒答，dav1d-sys 直接 panic。
          # 出货的 release.yml 本来就只有一个 macos-latest 任务、没有 x64 腿，这里与它对齐。
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 安装打包依赖 (create-dmg)
        run: brew install create-dmg

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 校验并修复 rustup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"

          echo "which rustup: $(which rustup || true)"
          ls -l "$CARGO_HOME/bin"/rustup* || true

          if ! rustup --version || ! rustup toolchain list; then
            echo "Detected invalid rustup binary, reinstalling..."
            rm -f "$CARGO_HOME/bin/rustup" "$CARGO_HOME/bin/rustup-init"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
            export PATH="$CARGO_HOME/bin:$PATH"
            rustup --version
            rustup toolchain list
          fi

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 拉取依赖 & 修复 Podfile
        run: |
          fvm flutter pub get
          if [ -f "macos/Podfile" ]; then
            sed -i '' "s/platform :osx, '[0-9.]*'/platform :osx, '15.0'/g" macos/Podfile
            ruby -i -pe '
              if /flutter_additional_macos_build_settings\(target\)/
                $_ += "      target.build_configurations.each do |config|\n        config.build_settings[\"MACOSX_DEPLOYMENT_TARGET\"] = \"15.0\"\n      end\n"
              end
            ' macos/Podfile
          fi

      - name: 诊断 coreml_upscale 的 Swift 编译（完整 note 级诊断）
        continue-on-error: true
        run: |
          # flutter/xcodebuild 这条路只显示 error 行，不给候选签名，已经连着猜错两次
          # （抬最低系统版本、Swift.Float16 限定 —— 报错一字未变）。
          # 这里用 runner 默认 Xcode 单独 typecheck 那批源码，把 note 全打出来。
          xcode-select -p
          xcodebuild -version
          ls packages/coreml_upscale/macos/Classes/*.swift
          xcrun swiftc -typecheck \
            -target arm64-apple-macos15.0 \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -import-objc-header /dev/null \
            packages/coreml_upscale/macos/Classes/*.swift 2>&1 | head -80
          echo "[rossi-diag] exit=$?"

      - name: 准备 dav1d 与 pkg-config（macOS 原生资产前置）
        run: |
          # 干净 runner 上没有 dav1d ⇒ dav1d-sys 探不到库就回退 meson，
          # 表现为 "failed to run custom build command for dav1d-sys v0.8.3"（本机装了 brew dav1d 所以编得过）。
          brew install dav1d pkg-config
          BP="$(brew --prefix)"
          echo "PKG_CONFIG_PATH=$BP/lib/pkgconfig:$BP/opt/dav1d/lib/pkgconfig" >> "$GITHUB_ENV"
          # Intel runner 上 pkg-config 认为自己在交叉编译，直接拒答，dav1d-sys 的 build.rs 就 panic：
          # PkgConfig(pkg-config has not been configured to support cross-compilation.)
          # 显式放行（arm64 上加了也无害）。
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "[rossi-macos] brew prefix=$BP dav1d=$(brew --prefix dav1d 2>/dev/null) pc文件=$(ls "$BP"/opt/dav1d/lib/pkgconfig/dav1d.pc 2>/dev/null || ls "$BP"/lib/pkgconfig/dav1d.pc 2>/dev/null || echo 缺)"

      - name: 编译 macOS 产物
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain list
          # 镜像默认 Xcode 比本机低一档：coreml_upscale 里 Float16(...)/dataType 比较这类写法
          # 在 Xcode 26.3 + macOS 26.2 SDK 上报 "argument passed to call that takes no arguments"
          # 并连带崩掉类型推断，而本机 Xcode 27 编得过（同一份源码）。
          # Flutter 只读 `xcode-select --print-path`、不读 DEVELOPER_DIR，所以这里必须真的切过去。
          BEST_DIR=""; BEST_VER=""
          for X in /Applications/Xcode*.app; do
            V=$(DEVELOPER_DIR="$X/Contents/Developer" xcodebuild -version 2>/dev/null | awk 'NR==1{print $2}')
            [ -z "$V" ] && continue
            if [ -z "$BEST_VER" ] || [ "$(printf '%s\n%s\n' "$BEST_VER" "$V" | sort -V | tail -1)" = "$V" ]; then
              BEST_VER="$V"; BEST_DIR="$X"
            fi
          done
          echo "[rossi-macos] Xcode 候选: $(ls -d /Applications/Xcode*.app | tr '\n' ' ') | 选中: ${BEST_DIR:-无} (${BEST_VER:-未知})"
          if [ -n "$BEST_DIR" ]; then sudo xcode-select -s "$BEST_DIR/Contents/Developer"; fi
          xcode-select -p
          xcodebuild -version
          rm -rf build/macos dist/macos
          mkdir -p dist/macos
          fvm flutter build macos --release --split-debug-info="build/symbols/macos-${{ matrix.arch }}"

          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Failed to find built .app for ${{ matrix.arch }}"
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH")
          cp -R "$APP_PATH" "dist/macos/$APP_NAME"

      - name: 制作 DMG
        run: |
          APP_PATH=$(find dist/macos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Failed to find staged .app for ${{ matrix.arch }}"
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH")
          DMG_NAME="Breeze-macOS-${{ matrix.arch }}.dmg"

          rm -f "$DMG_NAME"
          create-dmg \
            --volname "Breeze Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 150 190 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 450 190 \
            "$DMG_NAME" \
            "$APP_PATH"

      - name: 上传 macOS DMG
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: Breeze-macOS-${{ matrix.arch }}.dmg

  # ══════════════════════════════════════════
  # 5. iOS 构建 (免签)
  # ══════════════════════════════════════════
  build-ios:
    runs-on: macos-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 校验并修复 rustup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"

          echo "which rustup: $(which rustup || true)"
          ls -l "$CARGO_HOME/bin"/rustup* || true

          if ! rustup --version || ! rustup toolchain list; then
            echo "Detected invalid rustup binary, reinstalling..."
            rm -f "$CARGO_HOME/bin/rustup" "$CARGO_HOME/bin/rustup-init"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
            export PATH="$CARGO_HOME/bin:$PATH"
            rustup --version
            rustup toolchain list
          fi

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 准备 iOS dav1d 静态库
        run: |
          set -euo pipefail
          brew install meson nasm pkg-config
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          PREFIX="$PWD/third_party/ios_sysroot/aarch64-apple-ios"
          SRC="$PWD/third_party/dav1d-src"
          if [ ! -d "$SRC/.git" ]; then
            git clone --depth 1 -b 1.5.0 https://code.videolan.org/videolan/dav1d.git "$SRC"
          fi
          INI="$PWD/third_party/meson-ios.ini"
          cat > "$INI" <<EOF
          [binaries]
          c = ['xcrun', '--sdk', 'iphoneos', 'clang']
          cpp = ['xcrun', '--sdk', 'iphoneos', 'clang++']
          ar = ['xcrun', '--sdk', 'iphoneos', 'ar']
          strip = ['xcrun', '--sdk', 'iphoneos', 'strip']
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args = ['-arch', 'arm64', '-isysroot', '$SDKROOT', '-miphoneos-version-min=16.0']
          c_link_args = ['-arch', 'arm64', '-isysroot', '$SDKROOT', '-miphoneos-version-min=16.0']
          EOF
          rm -rf "$SRC/build-ios-aarch64" "$PREFIX"
          meson setup "$SRC/build-ios-aarch64" "$SRC" \
            --cross-file "$INI" \
            --prefix "$PREFIX" \
            --libdir lib \
            --default-library=static \
            -Denable_tests=false -Denable_examples=false -Denable_tools=false \
            -Dbitdepths="['8', '16']"
          ninja -C "$SRC/build-ios-aarch64"
          meson install -C "$SRC/build-ios-aarch64"

      - name: 编译 iOS (无签)
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/third_party/ios_sysroot/aarch64-apple-ios/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CARGO_TARGET_AARCH64_APPLE_IOS_LINKER="$(xcrun --sdk iphoneos --find clang)"
          export IPHONEOS_DEPLOYMENT_TARGET="16.0"
          export CFLAGS_aarch64_apple_ios="-miphoneos-version-min=$IPHONEOS_DEPLOYMENT_TARGET -isysroot $SDKROOT"
          export CXXFLAGS_aarch64_apple_ios="$CFLAGS_aarch64_apple_ios"
          export CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS="-C link-arg=-miphoneos-version-min=$IPHONEOS_DEPLOYMENT_TARGET"
          export RUSTFLAGS="$CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS"
          rm -f rust/.cargo/config.toml
          echo "--- CARGO_TARGET_AARCH64_APPLE_IOS_LINKER ---"
          printf '%s\n' "$CARGO_TARGET_AARCH64_APPLE_IOS_LINKER"
          echo "--- SDKROOT ---"
          printf '%s\n' "$SDKROOT"
          echo "--- IPHONEOS_DEPLOYMENT_TARGET ---"
          printf '%s\n' "${IPHONEOS_DEPLOYMENT_TARGET:-<unset>}"
          echo "--- RUSTFLAGS ---"
          printf '%s\n' "${RUSTFLAGS:-<unset>}"
          echo "--- CFLAGS_aarch64_apple_ios ---"
          printf '%s\n' "${CFLAGS_aarch64_apple_ios:-<unset>}"
          rustup toolchain list
          fvm flutter precache --ios
          fvm flutter pub get
          # 动态修改 pbxcproj，关闭整个项目的强签名要求：
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          fvm flutter build ios --release --no-codesign --split-debug-info=build/symbols

      - name: 封装 IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "Breeze-iOS.ipa" Payload

      - name: 上传 iOS IPA
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa
          path: Breeze-iOS.ipa
