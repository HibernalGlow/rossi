name: Breeze Multi-Platform Push Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
  BREEZE_PLUGIN_GITHUB_TOKEN: ${{ secrets.BREEZE_PLUGIN_GITHUB_TOKEN != '' &&
    secrets.BREEZE_PLUGIN_GITHUB_TOKEN || github.token }}

jobs:
  # secrets 上下文在 job 层 if 中不可用（该层只认 github/vars/needs 等），
  # 所以先用一个轻量 job 在 step 内检测 secret，再经 needs 输出给下游 job 做 if 判断
  check-android-secret:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - name: 检查 GIT_CRYPT_KEY 是否存在
        id: check
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if [ -z "$GIT_CRYPT_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

  # Fork 仓库 / Fork PR 拿不到 secrets，直接提示跳过原因，避免 UI 上只有一排灰色 Skipped 让人困惑
  android-skip-notice:
    runs-on: ubuntu-latest
    needs: check-android-secret
    if: ${{ needs.check-android-secret.outputs.has_key != 'true' }}
    steps:
      - name: 提示跳过 Android 构建
        run: |
          echo "跳过 Android 构建：未检测到 GIT_CRYPT_KEY（Fork 仓库推送 / Fork PR 无此 secret），其他平台正常构建。"

  # ══════════════════════════════════════════
  # 1. Android 构建
  # ══════════════════════════════════════════
  build-android:
    # 需要 git-crypt 解密签名文件，无 GIT_CRYPT_KEY（Fork 仓库推送 / Fork PR）时直接跳过整个 job
    needs: check-android-secret
    if: ${{ needs.check-android-secret.outputs.has_key == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 释放空间 (Nuclear Mode)
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/codeql
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android
          docker system prune -a -f
          sudo apt-get clean

      - name: 安装编译依赖 (LLVM/Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      - name: 解密敏感文件 (git-crypt)
        id: crypt
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y git-crypt
          echo "$GIT_CRYPT_KEY" | base64 -d > ./git-crypt-key
          git-crypt unlock ./git-crypt-key && rm ./git-crypt-key
          echo "android_flavor=release" >> "$GITHUB_OUTPUT"
          echo "ANDROID_FLAVOR=release" >> "$GITHUB_ENV"

      - name: 设置 Java 21 & SDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust (Android 目标)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 读取 NDK 版本配置
        id: ndk-config
        run: |
          NDK_VER=$(grep "ndkVersion" android/app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "ndk_version=$NDK_VER" >> $GITHUB_OUTPUT

      - name: 缓存 Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ steps.ndk-config.outputs.ndk_version }}
          key: ${{ runner.os }}-android-ndk-${{ steps.ndk-config.outputs.ndk_version }}

      - name: 安装 Android NDK
        run: yes | sdkmanager "ndk;${{ steps.ndk-config.outputs.ndk_version }}"

      - name: 安装 Android CMake
        run: yes | sdkmanager "cmake;3.22.1"

      - name: 设置 NDK 环境变量
        run: |
          NDK_VER=${{ steps.ndk-config.outputs.ndk_version }}
          ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VER"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 接受 Android Licenses
        run: yes | fvm flutter doctor --android-licenses || true

      - name: 拉取 Flutter 依赖
        run: fvm flutter pub get

      - name: 缓存 Android waifu2x CLI 依赖
        uses: actions/cache@v5
        with:
          path: third_party/android_ncnn_deps
          key: ${{ runner.os }}-android-waifu2x-deps-${{ hashFiles('script/android/prepare_android_waifu2x_deps.py', 'script/android/build_ncnn_static_android.py', 'script/android/build_waifu2x_cli_android.py', 'android/app/src/main/cpp/waifu2x_cli/CMakeLists.txt') }}

      - name: 缓存 ncnn 源码
        uses: actions/cache@v5
        with:
          path: third_party/ncnn-src
          key: ${{ runner.os }}-android-ncnn-src-${{ hashFiles('script/android/build_ncnn_static_android.py') }}

      - name: 缓存 RealSR-NCNN-Android 源码
        uses: actions/cache@v5
        with:
          path: third_party/RealSR-NCNN-Android
          key: ${{ runner.os }}-android-realsr-src-${{ hashFiles('script/android/build_waifu2x_cli_android.py') }}

      - name: 准备 Android waifu2x CLI 依赖
        run: |
          python3 script/android/prepare_android_waifu2x_deps.py

      - name: 编译 Android 静态 ncnn
        run: |
          python3 script/android/build_ncnn_static_android.py

      - name: 编译 Android waifu2x CLI
        run: |
          python3 script/android/build_waifu2x_cli_android.py

      - name: 准备 Android dav1d 交叉静态库
        run: |
          # 依据 docs/android-build.md §2/§2.1 与 third_party/build_dav1d_android.sh 的配方（那份脚本写死了
          # 本机 macOS 路径，CI 用不了）。要点三条：
          #  1. dav1d-sys 的兜底是「clone + meson setup（不带 cross file）」，会编出宿主架构的 .a，
          #     staticlib 不解析符号，要到最终链接才炸 ⇒ 必须自己用 NDK clang 的 cross file 编；
          #  2. 装进 third_party/android_sysroot/<triple>/{lib,include}，hook/build.dart 看到
          #     lib/pkgconfig 就会自己设 PKG_CONFIG_LIBDIR/PATH/ALLOW_CROSS（PKG_CONFIG_PATH 不够，
          #     它是追加，宿主那份 .pc 仍会被命中）；
          #  3. bionic 没有 libpthread.so，ort-sys 却发 -lpthread ⇒ 在自己的 sysroot 里放链接脚本。
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build nasm pkg-config
          NDK_VER=$(grep "ndkVersion" android/app/build.gradle.kts | awk -F'"' '{print $2}')
          NDK="$ANDROID_HOME/ndk/$NDK_VER"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -d "$BIN" ] || { echo "::error::找不到 NDK 工具链目录 $BIN"; exit 1; }
          SRC="$PWD/third_party/dav1d-src"
          if [ ! -d "$SRC/.git" ]; then
            git clone --depth 1 -b 1.5.0 https://code.videolan.org/videolan/dav1d.git "$SRC"
          fi
          for T in aarch64-linux-android x86_64-linux-android; do
            case "$T" in
              aarch64-linux-android) FAM=aarch64; CPU=aarch64 ;;
              x86_64-linux-android)  FAM=x86_64; CPU=x86_64 ;;
            esac
            PREFIX="$PWD/third_party/android_sysroot/$T"
            INI="$PWD/third_party/meson-android-$FAM.ini"
            cat > "$INI" <<EOF
          [binaries]
          c = '$BIN/${T}21-clang'
          cpp = '$BIN/${T}21-clang++'
          ar = '$BIN/llvm-ar'
          strip = '$BIN/llvm-strip'
          ranlib = '$BIN/llvm-ranlib'
          pkgconfig = 'pkg-config'

          [properties]
          sys_root = '$BIN/../sysroot'
          needs_exe_wrapper = true

          [host_machine]
          system = 'android'
          cpu_family = '$FAM'
          cpu = '$CPU'
          endian = 'little'
          EOF
            rm -rf "$SRC/build-cross-$FAM" "$PREFIX"
            meson setup "$SRC/build-cross-$FAM" "$SRC" \
              --cross-file "$INI" \
              --prefix "$PREFIX" \
              --libdir lib \
              --default-library=static \
              -Denable_tests=false -Denable_examples=false -Denable_tools=false \
              -Dbitdepths="['8', '16']"
            ninja -C "$SRC/build-cross-$FAM"
            ninja -C "$SRC/build-cross-$FAM" install
            printf 'INPUT(-lc)\n' > "$PREFIX/lib/libpthread.so"
            echo "== $T =="
            find "$PREFIX" -name '*.pc' -o -name '*.a' | sort
            "$BIN/llvm-readelf" -h "$PREFIX/lib/libdav1d.a" 2>/dev/null | head -3 || true
            PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" pkg-config --modversion --define-prefix dav1d || true
          done

      - name: 运行 Android 构建脚本
        run: |
          # build_apk.dart 无参数=release 分 ABI；带任意参数=debug（--target-platform=android-arm64,android-x64）
          if [ "${ANDROID_FLAVOR:-release}" = debug ]; then
            fvm dart ./script/build/build_apk.dart debug
          else
            fvm dart ./script/build/build_apk.dart
          fi

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v6
        with:
          name: android-apks-${{ env.ANDROID_FLAVOR || 'release' }}
          path: |
            build/app/outputs/**/*.apk

  # ══════════════════════════════════════════
  # 2. Linux 构建
  # ══════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 设置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 安装 Flatpak 构建环境
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ninja-build libgtk-3-dev liblzma-dev libgcrypt20-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev libmpv-dev libdav1d-dev
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 构建 Linux + 可选上传符号 + 构建 Flatpak
        run: |
          fvm dart ./script/build/build_linux_flatpak.dart

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v6
        with:
          name: linux-flatpak
          path: breeze.flatpak

      - name: 构建 Linux .deb
        run: |
          sudo apt-get install -y dpkg-dev
          fvm dart ./script/build/build_linux_deb.dart --package-only

      - name: 上传 Linux deb
        uses: actions/upload-artifact@v6
        with:
          name: linux-deb
          path: build-deb/breeze_*.deb

  # ══════════════════════════════════════════
  # 3. Windows 构建
  # ══════════════════════════════════════════
  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - name: 关闭 Git CRLF 转换
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 设置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          fvm install && fvm use --force
          echo "$((Get-Item .).FullName)\.fvm\flutter_sdk\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust/Tauri 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            windows-installer/src-tauri

      - name: 设置 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 准备 dav1d 与 pkg-config（Windows 原生资产前置）
        shell: pwsh
        run: |
          # 配方出处：docs/windows-build/win-baseline-env.sh:177-210
          # native-assets hook 是 Flutter 另起的进程，环境是干净的，shell 里的 export
          # 传不到 cargo 的 build script —— PKG_CONFIG_PATH 必须写进 .cargo/config.toml
          # 的 [env] 段，否则 image 的 avif-native 挂在 dav1d-sys 的 build.rs，
          # 只报一句 "Building native assets failed"。路径一律现查，不写死。
          $vcpkg = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { $env:VCPKG_INSTALLATION_ROOT }
          if (-not $vcpkg) { "::error::runner 上没有 VCPKG_ROOT / VCPKG_INSTALLATION_ROOT"; exit 1 }
          & (Join-Path $vcpkg 'vcpkg.exe') install dav1d:x64-windows pkgconf:x64-windows
          # dav1d-sys 0.8.3 的 build.rs 不是「链接现成 dav1d」，而是解包 dav1d 源码自己编
          # （失败时日志里能看到 dav1d-1.5.4.tar.gz），x86 汇编要 nasm、配置要 meson+ninja，
          # GitHub 的 Windows 镜像这三样都没有 ⇒ 只补 pkg-config 仍然编不过。
          choco install nasm -y --no-progress
          python -m pip install --quiet --disable-pip-version-check meson ninja
          $nasmDir = Split-Path (Get-Command nasm -ErrorAction SilentlyContinue).Source
          if ($nasmDir) { Add-Content -Path $env:GITHUB_PATH -Value $nasmDir }
          $scripts = (python -c "import os,sysconfig;print(os.path.join(sysconfig.get_path('scripts')))").Trim()
          if (Test-Path $scripts) { Add-Content -Path $env:GITHUB_PATH -Value $scripts }
          "::notice::nasm=$nasmDir scripts=$scripts meson=$((Get-Command meson -ErrorAction SilentlyContinue).Source) ninja=$((Get-Command ninja -ErrorAction SilentlyContinue).Source)"
          $installed = Join-Path $vcpkg 'installed'
          # 必须优先 release：vcpkg 会把 dav1d.pc 同时放进 lib/pkgconfig 与 debug/lib/pkgconfig，
          # 早期版本这里用 -Recurse 取第一个命中，拿到了 debug 那份 ⇒ pkg-config 探不到可用库，
          # system-deps 于是回退去跑 meson（本机文档记过 meson 探测 MSVC 也会断）。
          $pcs = @(Get-ChildItem -Path $installed -Filter dav1d.pc -Recurse -ErrorAction SilentlyContinue |
                   Where-Object { $_.Directory.Name -eq 'pkgconfig' } |
                   Select-Object -ExpandProperty DirectoryName)
          $pcdir = @($pcs | Where-Object { $_ -notmatch '\\debug\\' })[0]
          if (-not $pcdir) { $pcdir = $pcs[0] }
          if (-not $pcdir) {
            "::error::装完 dav1d 仍找不到 dav1d.pc，当前 .pc 落点："
            Get-ChildItem -Path $installed -Filter '*.pc' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 20 -ExpandProperty FullName
            exit 1
          }
          if (-not $pcdir) {
            "::error::装完 dav1d 仍找不到 dav1d.pc，当前 .pc 落点："
            Get-ChildItem -Path $installed -Filter '*.pc' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 20 -ExpandProperty FullName
            exit 1
          }
          $pkgconfig = Get-ChildItem -Path $installed -Include 'pkg-config.exe', 'pkgconf.exe' -Recurse -ErrorAction SilentlyContinue |
                       Select-Object -First 1 -ExpandProperty FullName
          if ($pkgconfig) { Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG=$pkgconfig" }
          # 两份都要写：仓库根那份只对 cwd 在仓库内的 cargo 调用生效；
          # flutter 的 native-assets 钩子把 cargo 的 cwd 放在构建目录，够不到仓库根的 .cargo/config.toml
          # （实测：步骤里直连 `cargo build -p windcore` 能过，钩子里同一个 crate 却回退去跑 meson）。
          # 用户级 $env:USERPROFILE\.cargo\config.toml 与 cwd 无关，cargo 必读 ⇒ 钩子才拿得到 PKG_CONFIG_PATH。
          $userCargo = Join-Path $env:USERPROFILE '.cargo'
          New-Item -ItemType Directory -Force -Path $userCargo | Out-Null
          $tomlBody = $toml
          [IO.File]::WriteAllText((Join-Path $userCargo 'config.toml'), $tomlBody)
          New-Item -ItemType Directory -Force -Path '.cargo' | Out-Null
          $fwd = $pcdir -replace '\\', '/'
          # 两条都要：pkg-config-rs 先看 PKG_CONFIG，再看 PATH；vcpkg 的 pkgconf.exe 不在 PATH 上，
          # 而 native-assets 钩子的子进程环境是干净的 ⇒ 只给 PKG_CONFIG_PATH 时它会找不到可执行文件，
          # 探测失败就回退去跑 meson（实测：同一步里直连 cargo 能过，钩子里同一 crate 失败）。
          $toml = '[env]' + "`n" + 'PKG_CONFIG_PATH = { value = "' + $fwd + '", force = false }' + "`n"
          if ($pkgconfig) { $toml += 'PKG_CONFIG = { value = "' + ($pkgconfig -replace '\\','/') + '", force = false }' + "`n" }
          [IO.File]::WriteAllText((Join-Path (Get-Location) '.cargo/config.toml'), $toml)
          # 光有 [env] 段不够：windows/runner/CMakeLists.txt 用 `cmake -E env` 单独调 cargo 编
          # rossi_gpu_present.dll，而 cargo 的 [env] 是按**当前工作目录**向上找配置的 —— 那次调用的
          # cwd 是构建目录，够不到仓库根这份 config.toml（该文件 126-133 行自己写明了这点）。
          # 它只在 ENV{PKG_CONFIG_PATH} 存在时才把变量递给 cargo，所以这里必须同时把它放进作业环境，
          # 否则 local_core 的 dav1d-sys 找不到 pkg-config，cargo 以 101 退出且 MSBuild 不给输出。
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$fwd"
          $dlls = @(Get-ChildItem -Path $installed -Filter dav1d.dll -Recurse -ErrorAction SilentlyContinue |
                   Where-Object { $_.Directory.Name -eq 'bin' } |
                   Select-Object -ExpandProperty FullName)
          $dll = @($dlls | Where-Object { $_ -notmatch '\\debug\\' })[0]
          if (-not $dll) { $dll = $dlls[0] }
          if ($dll) { Add-Content -Path $env:GITHUB_ENV -Value "DAV1D_DLL=$dll" }
          else { "::warning::未找到 dav1d.dll —— 产物会缺 AVIF 运行时依赖（构建本身不受影响）" }
          "::notice::PKG_CONFIG_PATH=$fwd / PKG_CONFIG=$pkgconfig / DAV1D_DLL=$dll"

      - name: 预编 rust/gpu_present（把 cargo 的真实报错放到日志上）
        shell: pwsh
        run: |
          # windows/runner/CMakeLists.txt 用 `cmake -E env` 调 cargo 编 rossi_gpu_present.dll；
          # 它失败时 MSBuild 只报 MSB8066 退出码 101，cargo 自己的输出一个字都不出现
          # （该文件 118-133 行把这个指纹写得很清楚）。这里按同一套环境变量直接跑 cargo，
          # 产物落点也和 CMake 一致（<crate>/target），这样要么看见真错误，
          # 要么让那条自定义命令本来就是 up-to-date。
          $env:CARGO_TARGET_DIR = (Resolve-Path '.').Path + '\rust\gpu_present\target'
          cargo build --release --manifest-path rust/gpu_present/Cargo.toml
          if ($LASTEXITCODE -ne 0) { "::error::cargo 预编 gpu_present 失败，退出码 $LASTEXITCODE"; exit 1 }
          Get-ChildItem "$env:CARGO_TARGET_DIR\release\rossi_gpu_present.dll" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          # MSBuild 会把 build script 的 stderr 整段吞掉，只剩下
          # "CUSTOMBUILD : error : failed to run custom build command for dav1d-sys v0.8.3"。
          # 这里绕开 MSBuild 直接编 windcore（native-assets hook 编的就是它），
          # 让 cargo 自己把缺什么打在步骤日志里；失败也让它停在这一步，
          # 这样上面紧挨着的就是原始报错。
          $env:CARGO_TARGET_DIR = (Resolve-Path '.').Path + '\rust\target'
          cargo build --release --manifest-path rust/Cargo.toml -p windcore
          if ($LASTEXITCODE -ne 0) { "::error::cargo 预编 windcore 失败，退出码 $LASTEXITCODE（原始报错见上）"; exit 1 }

      - name: 运行 Windows 构建脚本
        run: |
          fvm flutter pub get
          fvm dart ./script/build/build_windows.dart

      # flutter build windows 失败在 INSTALL.vcxproj 时，MSBuild 只把整条命令回显出来，
      # cmake_install.cmake 真正的报错（哪一行、拷不到哪个文件）被吞掉，日志里查不到原因。
      # 这里在失败后把同一件事直接跑一遍，让 cmake 自己把话说完整。
      - name: 诊断 cmake install 的真实报错（构建失败时）
        if: failure()
        run: |
          $ErrorActionPreference = 'Continue'
          $root = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64'
          if (-not (Test-Path $root)) { Write-Host "::error::没有 $root（没走到 CMake 生成阶段）"; exit 0 }
          Write-Host "=== 可疑的安装来源是否存在 ==="
          foreach ($p in @(
              (Join-Path $root 'native_assets\windows'),
              (Join-Path $root 'flutter_assets'),
              (Join-Path $root 'runner\Release'))) {
            if (Test-Path $p) {
              Write-Host "EXIST $p  条目数=$((Get-ChildItem -Recurse -File -ErrorAction SilentlyContinue $p).Count)"
            } else {
              Write-Host "MISSING $p"
            }
          }
          Write-Host "=== CMakeCache 里与 install 相关的键 ==="
          Select-String -Path (Join-Path $root 'CMakeCache.txt') `
            -Pattern 'AOT_LIBRARY|NATIVE_ASSETS|DAV1D|CMAKE_INSTALL_PREFIX|FLUTTER_LIBRARY|BUILD_TYPE' `
            -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Line }
          $vsCmake = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter cmake.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\CommonExtensions\\Microsoft\\CMake\\CMake\\bin\\cmake.exe$' } |
            Select-Object -First 1
          if ($vsCmake) {
            # 构建用的是 VS 自带的 CMake。上一版诊断让 PATH 上的 cmake 抢了（实际是 C:\Strawberry\c\bin），
            # 于是同一段脚本报成 warning、rc=0，与 MSBuild 里的 exit 1 对不上 —— 复现必须用同一个二进制。
            $cmake = $vsCmake.FullName
          } else {
            $cmake = (Get-Command cmake -ErrorAction SilentlyContinue).Source
          }
          if (-not $cmake) {
            $cmake = 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          }
          Write-Host "=== 用 cmake=$cmake 直接重跑 install ==="
          Push-Location $root
          & $cmake -DBUILD_TYPE=Release -P cmake_install.cmake 2>&1 | ForEach-Object { Write-Host $_ }
          Write-Host "CMAKE_INSTALL_RC=$LASTEXITCODE"
          # 报错会给出行号，这里把脚本连行号一起打出来，行号就能直接对上内容。
          Write-Host "=== cmake_install.cmake（带行号） ==="
          Select-String -Path (Join-Path $root 'cmake_install.cmake') -Pattern '.' `
            -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "$($_.LineNumber): $($_.Line)" }
          Write-Host "=== native_assets 目录实际内容 ==="
          Get-ChildItem -Recurse -File (Join-Path $root 'native_assets') -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }
          Pop-Location

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe
          path: windows-installer/src-tauri/target/release/windows-installer.exe

      # - name: 运行 Windows 构建脚本
      #   run: |
      #     fvm flutter pub get
      #     fvm dart ./script/build/build_windows.dart --prepare-only

      # - name: 上传未签名 Windows 主程序
      #   id: upload-zephyr
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: zephyr-exe
      #     path: build/windows/x64/runner/Release/zephyr.exe

      # - name: SignPath 签名 Windows 主程序
      #   id: sign-zephyr
      #   uses: SignPath/github-action-submit-signing-request@v2
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: f3cf3aed-f869-41ec-95c1-27dbd2926618
      #     project-slug: Breeze
      #     signing-policy-slug: test-signing
      #     artifact-configuration-slug: windows-app-exe
      #     github-artifact-id: ${{ steps.upload-zephyr.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: ${{ runner.temp }}\signed-zephyr

      # - name: 回灌已签名 Windows 主程序
      #   shell: pwsh
      #   run: |
      #     Copy-Item -Force "${{ runner.temp }}\signed-zephyr\zephyr.exe" "build/windows/x64/runner/Release/zephyr.exe"

      # - name: 继续构建 Windows 安装器
      #   run: |
      #     fvm dart ./script/build/build_windows.dart --package-only

      # - name: 上传未签名 Windows 安装器
      #   id: upload-installer
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: windows-installer-exe
      #     path: windows-installer/src-tauri/target/release/windows-installer.exe

      # - name: SignPath 签名 Windows 安装器
      #   id: sign-installer
      #   uses: SignPath/github-action-submit-signing-request@v2
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: f3cf3aed-f869-41ec-95c1-27dbd2926618
