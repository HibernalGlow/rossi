name: Breeze Multi-Platform Push Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
  BREEZE_PLUGIN_GITHUB_TOKEN: ${{ secrets.BREEZE_PLUGIN_GITHUB_TOKEN != '' &&
    secrets.BREEZE_PLUGIN_GITHUB_TOKEN || github.token }}

jobs:
  # ══════════════════════════════════════════
  # 1. Android 构建
  # ══════════════════════════════════════════
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 释放空间 (Nuclear Mode)
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/codeql
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android
          docker system prune -a -f
          sudo apt-get clean

      - name: 安装编译依赖 (LLVM/Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      - name: 解密敏感文件 (git-crypt)
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y git-crypt
          echo "$GIT_CRYPT_KEY" | base64 -d > ./git-crypt-key
          git-crypt unlock ./git-crypt-key && rm ./git-crypt-key

      - name: 设置 Java 21 & SDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust (Android 目标)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 读取 NDK 版本配置
        id: ndk-config
        run: |
          NDK_VER=$(grep "ndkVersion" android/app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "ndk_version=$NDK_VER" >> $GITHUB_OUTPUT

      - name: 缓存 Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ steps.ndk-config.outputs.ndk_version }}
          key: ${{ runner.os }}-android-ndk-${{ steps.ndk-config.outputs.ndk_version }}

      - name: 安装 Android NDK
        run: yes | sdkmanager "ndk;${{ steps.ndk-config.outputs.ndk_version }}"

      - name: 安装 Android CMake
        run: yes | sdkmanager "cmake;3.22.1"

      - name: 设置 NDK 环境变量
        run: |
          NDK_VER=${{ steps.ndk-config.outputs.ndk_version }}
          ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VER"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 接受 Android Licenses
        run: yes | fvm flutter doctor --android-licenses || true

      - name: 拉取 Flutter 依赖
        run: fvm flutter pub get

      - name: 缓存 Android waifu2x CLI 依赖
        uses: actions/cache@v5
        with:
          path: third_party/android_ncnn_deps
          key: ${{ runner.os }}-android-waifu2x-deps-${{ hashFiles('script/prepare_android_waifu2x_deps.py', 'script/build_ncnn_static_android.py', 'script/build_waifu2x_cli_android.py', 'android/app/src/main/cpp/waifu2x_cli/CMakeLists.txt') }}

      - name: 缓存 ncnn 源码
        uses: actions/cache@v5
        with:
          path: third_party/ncnn-src
          key: ${{ runner.os }}-android-ncnn-src-${{ hashFiles('script/build_ncnn_static_android.py') }}

      - name: 缓存 RealSR-NCNN-Android 源码
        uses: actions/cache@v5
        with:
          path: third_party/RealSR-NCNN-Android
          key: ${{ runner.os }}-android-realsr-src-${{ hashFiles('script/build_waifu2x_cli_android.py') }}

      - name: 准备 Android waifu2x CLI 依赖
        run: |
          python3 script/prepare_android_waifu2x_deps.py

      - name: 编译 Android 静态 ncnn
        run: |
          python3 script/build_ncnn_static_android.py

      - name: 编译 Android waifu2x CLI
        run: |
          python3 script/build_waifu2x_cli_android.py

      - name: 运行 Android 构建脚本
        run: |
          fvm dart ./script/build_apk.dart

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v6
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/skia/*.apk

  # ══════════════════════════════════════════
  # 2. Linux 构建
  # ══════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 设置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 安装 Flatpak 构建环境
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ninja-build libgtk-3-dev liblzma-dev libgcrypt20-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 构建 Linux + 可选上传符号 + 构建 Flatpak
        run: |
          fvm dart ./script/build_linux_flatpak.dart

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v6
        with:
          name: linux-flatpak
          path: breeze.flatpak

      - name: 构建 Linux .deb
        run: |
          sudo apt-get install -y dpkg-dev
          fvm dart ./script/build_linux_deb.dart --package-only

      - name: 上传 Linux deb
        uses: actions/upload-artifact@v6
        with:
          name: linux-deb
          path: build-deb/breeze_*.deb

  # ══════════════════════════════════════════
  # 3. Windows 构建
  # ══════════════════════════════════════════
  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - name: 关闭 Git CRLF 转换
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 设置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          fvm install && fvm use --force
          echo "$((Get-Item .).FullName)\.fvm\flutter_sdk\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust/Tauri 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            windows-installer/src-tauri

      - name: 设置 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 准备 dav1d 与 pkg-config（Windows 原生资产前置）
        shell: pwsh
        run: |
          # 配方出处：docs/windows-build/win-baseline-env.sh:177-210
          # native-assets hook 是 Flutter 另起的进程，环境是干净的，shell 里的 export
          # 传不到 cargo 的 build script —— PKG_CONFIG_PATH 必须写进 .cargo/config.toml
          # 的 [env] 段，否则 image 的 avif-native 挂在 dav1d-sys 的 build.rs，
          # 只报一句 "Building native assets failed"。路径一律现查，不写死。
          $vcpkg = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { $env:VCPKG_INSTALLATION_ROOT }
          if (-not $vcpkg) { "::error::runner 上没有 VCPKG_ROOT / VCPKG_INSTALLATION_ROOT"; exit 1 }
          & (Join-Path $vcpkg 'vcpkg.exe') install dav1d:x64-windows pkgconf:x64-windows
          # dav1d-sys 0.8.3 的 build.rs 不是「链接现成 dav1d」，而是解包 dav1d 源码自己编
          # （失败时日志里能看到 dav1d-1.5.4.tar.gz），x86 汇编要 nasm、配置要 meson+ninja，
          # GitHub 的 Windows 镜像这三样都没有 ⇒ 只补 pkg-config 仍然编不过。
          choco install nasm -y --no-progress
          python -m pip install --quiet --disable-pip-version-check meson ninja
          $nasmDir = Split-Path (Get-Command nasm -ErrorAction SilentlyContinue).Source
          if ($nasmDir) { Add-Content -Path $env:GITHUB_PATH -Value $nasmDir }
          $scripts = (python -c "import os,sysconfig;print(os.path.join(sysconfig.get_path('scripts')))").Trim()
          if (Test-Path $scripts) { Add-Content -Path $env:GITHUB_PATH -Value $scripts }
          "::notice::nasm=$nasmDir scripts=$scripts meson=$((Get-Command meson -ErrorAction SilentlyContinue).Source) ninja=$((Get-Command ninja -ErrorAction SilentlyContinue).Source)"
          $installed = Join-Path $vcpkg 'installed'
          $pcdir = Get-ChildItem -Path $installed -Filter dav1d.pc -Recurse -ErrorAction SilentlyContinue |
                   Where-Object { $_.Directory.Name -eq 'pkgconfig' } |
                   Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $pcdir) {
            "::error::装完 dav1d 仍找不到 dav1d.pc，当前 .pc 落点："
            Get-ChildItem -Path $installed -Filter '*.pc' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 20 -ExpandProperty FullName
            exit 1
          }
          $pkgconfig = Get-ChildItem -Path $installed -Include 'pkg-config.exe', 'pkgconf.exe' -Recurse -ErrorAction SilentlyContinue |
                       Select-Object -First 1 -ExpandProperty FullName
          if ($pkgconfig) { Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG=$pkgconfig" }
          New-Item -ItemType Directory -Force -Path '.cargo' | Out-Null
          $fwd = $pcdir -replace '\\', '/'
          $toml = '[env]' + "`n" + 'PKG_CONFIG_PATH = { value = "' + $fwd + '", force = false }' + "`n"
          [IO.File]::WriteAllText((Join-Path (Get-Location) '.cargo/config.toml'), $toml)
          # 光有 [env] 段不够：windows/runner/CMakeLists.txt 用 `cmake -E env` 单独调 cargo 编
          # rossi_gpu_present.dll，而 cargo 的 [env] 是按**当前工作目录**向上找配置的 —— 那次调用的
          # cwd 是构建目录，够不到仓库根这份 config.toml（该文件 126-133 行自己写明了这点）。
          # 它只在 ENV{PKG_CONFIG_PATH} 存在时才把变量递给 cargo，所以这里必须同时把它放进作业环境，
          # 否则 local_core 的 dav1d-sys 找不到 pkg-config，cargo 以 101 退出且 MSBuild 不给输出。
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$fwd"
          $dll = Get-ChildItem -Path $installed -Filter dav1d.dll -Recurse -ErrorAction SilentlyContinue |
                 Where-Object { $_.Directory.Name -eq 'bin' } |
                 Select-Object -First 1 -ExpandProperty FullName
          if ($dll) { Add-Content -Path $env:GITHUB_ENV -Value "DAV1D_DLL=$dll" }
          else { "::warning::未找到 dav1d.dll —— 产物会缺 AVIF 运行时依赖（构建本身不受影响）" }
          "::notice::PKG_CONFIG_PATH=$fwd / PKG_CONFIG=$pkgconfig / DAV1D_DLL=$dll"

      - name: 预编 rust/gpu_present（把 cargo 的真实报错放到日志上）
        shell: pwsh
        run: |
          # windows/runner/CMakeLists.txt 用 `cmake -E env` 调 cargo 编 rossi_gpu_present.dll；
          # 它失败时 MSBuild 只报 MSB8066 退出码 101，cargo 自己的输出一个字都不出现
          # （该文件 118-133 行把这个指纹写得很清楚）。这里按同一套环境变量直接跑 cargo，
          # 产物落点也和 CMake 一致（<crate>/target），这样要么看见真错误，
          # 要么让那条自定义命令本来就是 up-to-date。
          $env:CARGO_TARGET_DIR = (Resolve-Path '.').Path + '\rust\gpu_present\target'
          cargo build --release --manifest-path rust/gpu_present/Cargo.toml
          if ($LASTEXITCODE -ne 0) { "::error::cargo 预编 gpu_present 失败，退出码 $LASTEXITCODE"; exit 1 }
          Get-ChildItem "$env:CARGO_TARGET_DIR\release\rossi_gpu_present.dll" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          # MSBuild 会把 build script 的 stderr 整段吞掉，只剩下
          # "CUSTOMBUILD : error : failed to run custom build command for dav1d-sys v0.8.3"。
          # 这里绕开 MSBuild 直接编 windcore（native-assets hook 编的就是它），
          # 让 cargo 自己把缺什么打在步骤日志里；失败也让它停在这一步，
          # 这样上面紧挨着的就是原始报错。
          $env:CARGO_TARGET_DIR = (Resolve-Path '.').Path + '\rust\target'
          cargo build --release --manifest-path rust/Cargo.toml -p windcore
          if ($LASTEXITCODE -ne 0) { "::error::cargo 预编 windcore 失败，退出码 $LASTEXITCODE（原始报错见上）"; exit 1 }

      - name: 运行 Windows 构建脚本
        run: |
          fvm flutter pub get
          fvm dart ./script/build_windows.dart

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe
          path: windows-installer/src-tauri/target/release/windows-installer.exe

      # - name: 运行 Windows 构建脚本
      #   run: |
      #     fvm flutter pub get
      #     fvm dart ./script/build_windows.dart --prepare-only

      # - name: 上传未签名 Windows 主程序
      #   id: upload-zephyr
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: zephyr-exe
      #     path: build/windows/x64/runner/Release/zephyr.exe

      # - name: SignPath 签名 Windows 主程序
      #   id: sign-zephyr
      #   uses: SignPath/github-action-submit-signing-request@v2
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: f3cf3aed-f869-41ec-95c1-27dbd2926618
      #     project-slug: Breeze
      #     signing-policy-slug: test-signing
      #     artifact-configuration-slug: windows-app-exe
      #     github-artifact-id: ${{ steps.upload-zephyr.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: ${{ runner.temp }}\signed-zephyr

      # - name: 回灌已签名 Windows 主程序
      #   shell: pwsh
      #   run: |
      #     Copy-Item -Force "${{ runner.temp }}\signed-zephyr\zephyr.exe" "build/windows/x64/runner/Release/zephyr.exe"

      # - name: 继续构建 Windows 安装器
      #   run: |
      #     fvm dart ./script/build_windows.dart --package-only

      # - name: 上传未签名 Windows 安装器
      #   id: upload-installer
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: windows-installer-exe
      #     path: windows-installer/src-tauri/target/release/windows-installer.exe

      # - name: SignPath 签名 Windows 安装器
      #   id: sign-installer
      #   uses: SignPath/github-action-submit-signing-request@v2
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: f3cf3aed-f869-41ec-95c1-27dbd2926618
      #     project-slug: Breeze
      #     signing-policy-slug: test-signing
      #     artifact-configuration-slug: windows-installer-exe
      #     github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: ${{ runner.temp }}\signed-installer

      # - name: 回灌已签名 Windows 安装器
      #   shell: pwsh
      #   run: |
      #     Copy-Item -Force "${{ runner.temp }}\signed-installer\windows-installer.exe" "windows-installer/src-tauri/target/release/windows-installer.exe"

      # - name: 上传已签名 Windows 安装器
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: windows-installer-signed
      #     path: windows-installer/src-tauri/target/release/windows-installer.exe

  # ══════════════════════════════════════════
  # 4. macOS 构建
  # ══════════════════════════════════════════
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 安装打包依赖 (create-dmg)
        run: brew install create-dmg

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 校验并修复 rustup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"

          echo "which rustup: $(which rustup || true)"
          ls -l "$CARGO_HOME/bin"/rustup* || true

          if ! rustup --version || ! rustup toolchain list; then
            echo "Detected invalid rustup binary, reinstalling..."
            rm -f "$CARGO_HOME/bin/rustup" "$CARGO_HOME/bin/rustup-init"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
            export PATH="$CARGO_HOME/bin:$PATH"
            rustup --version
            rustup toolchain list
          fi

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 拉取依赖 & 修复 Podfile
        run: |
          fvm flutter pub get
          if [ -f "macos/Podfile" ]; then
            sed -i '' "s/platform :osx, '[0-9.]*'/platform :osx, '15.0'/g" macos/Podfile
            ruby -i -pe '
              if /flutter_additional_macos_build_settings\(target\)/
                $_ += "      target.build_configurations.each do |config|\n        config.build_settings[\"MACOSX_DEPLOYMENT_TARGET\"] = \"15.0\"\n      end\n"
              end
            ' macos/Podfile
          fi

      - name: 编译 macOS 产物
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain list
          # 镜像默认 Xcode 比本机低一档：coreml_upscale 里 Float16(...)/dataType 比较这类写法
          # 在 Xcode 26.3 + macOS 26.2 SDK 上报 "argument passed to call that takes no arguments"
          # 并连带崩掉类型推断，而本机 Xcode 27 编得过（同一份源码）。
          # Flutter 只读 `xcode-select --print-path`、不读 DEVELOPER_DIR，所以这里必须真的切过去。
          BEST_DIR=""; BEST_VER=""
          for X in /Applications/Xcode*.app; do
            V=$(DEVELOPER_DIR="$X/Contents/Developer" xcodebuild -version 2>/dev/null | awk 'NR==1{print $2}')
            [ -z "$V" ] && continue
            if [ -z "$BEST_VER" ] || [ "$(printf '%s\n%s\n' "$BEST_VER" "$V" | sort -V | tail -1)" = "$V" ]; then
              BEST_VER="$V"; BEST_DIR="$X"
            fi
          done
          echo "[rossi-macos] Xcode 候选: $(ls -d /Applications/Xcode*.app | tr '\n' ' ') | 选中: ${BEST_DIR:-无} (${BEST_VER:-未知})"
          if [ -n "$BEST_DIR" ]; then sudo xcode-select -s "$BEST_DIR/Contents/Developer"; fi
          xcode-select -p
          xcodebuild -version
          rm -rf build/macos dist/macos
          mkdir -p dist/macos
          fvm flutter build macos --release --split-debug-info="build/symbols/macos-${{ matrix.arch }}"

          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Failed to find built .app for ${{ matrix.arch }}"
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH")
          cp -R "$APP_PATH" "dist/macos/$APP_NAME"

      - name: 制作 DMG
        run: |
          APP_PATH=$(find dist/macos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Failed to find staged .app for ${{ matrix.arch }}"
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH")
          DMG_NAME="Breeze-macOS-${{ matrix.arch }}.dmg"

          rm -f "$DMG_NAME"
          create-dmg \
            --volname "Breeze Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 150 190 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 450 190 \
            "$DMG_NAME" \
            "$APP_PATH"

      - name: 上传 macOS DMG
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: Breeze-macOS-${{ matrix.arch }}.dmg

  # ══════════════════════════════════════════
  # 5. iOS 构建 (免签)
  # ══════════════════════════════════════════
  build-ios:
    runs-on: macos-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 校验并修复 rustup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"

          echo "which rustup: $(which rustup || true)"
          ls -l "$CARGO_HOME/bin"/rustup* || true

          if ! rustup --version || ! rustup toolchain list; then
            echo "Detected invalid rustup binary, reinstalling..."
            rm -f "$CARGO_HOME/bin/rustup" "$CARGO_HOME/bin/rustup-init"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
            export PATH="$CARGO_HOME/bin:$PATH"
            rustup --version
            rustup toolchain list
          fi

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 编译 iOS (无签)
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CARGO_TARGET_AARCH64_APPLE_IOS_LINKER="$(xcrun --sdk iphoneos --find clang)"
          export IPHONEOS_DEPLOYMENT_TARGET="15.0"
          export CFLAGS_aarch64_apple_ios="-miphoneos-version-min=$IPHONEOS_DEPLOYMENT_TARGET -isysroot $SDKROOT"
          export CXXFLAGS_aarch64_apple_ios="$CFLAGS_aarch64_apple_ios"
          export CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS="-C link-arg=-miphoneos-version-min=$IPHONEOS_DEPLOYMENT_TARGET"
          export RUSTFLAGS="$CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS"
          rm -f rust/.cargo/config.toml
          echo "--- CARGO_TARGET_AARCH64_APPLE_IOS_LINKER ---"
          printf '%s\n' "$CARGO_TARGET_AARCH64_APPLE_IOS_LINKER"
          echo "--- SDKROOT ---"
          printf '%s\n' "$SDKROOT"
          echo "--- IPHONEOS_DEPLOYMENT_TARGET ---"
          printf '%s\n' "${IPHONEOS_DEPLOYMENT_TARGET:-<unset>}"
          echo "--- RUSTFLAGS ---"
          printf '%s\n' "${RUSTFLAGS:-<unset>}"
          echo "--- CFLAGS_aarch64_apple_ios ---"
          printf '%s\n' "${CFLAGS_aarch64_apple_ios:-<unset>}"
          rustup toolchain list
          fvm flutter precache --ios
          fvm flutter pub get
          # 动态修改 pbxcproj，关闭整个项目的强签名要求：
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          fvm flutter build ios --release --no-codesign --split-debug-info=build/symbols

      - name: 封装 IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "Breeze-iOS.ipa" Payload

      - name: 上传 iOS IPA
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa
          path: Breeze-iOS.ipa
