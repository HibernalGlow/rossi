name: Breeze Multi-Platform Push Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
  BREEZE_PLUGIN_GITHUB_TOKEN: ${{ secrets.BREEZE_PLUGIN_GITHUB_TOKEN != '' &&
    secrets.BREEZE_PLUGIN_GITHUB_TOKEN || github.token }}

jobs:
  # Fork PR 拿不到 GitHub Variables，直接提示跳过原因，避免 UI 上只有一排灰色
  # Skipped 让人困惑。Android 签名走 Infisical 的 GitHub OIDC，不需要 GitHub secret。
  check-android-secret:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - name: 检查 Infisical OIDC 配置
        id: check
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
        run: |
          if [ -z "$INFISICAL_IDENTITY_ID" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

  # Fork 仓库 / Fork PR 拿不到 Variables，其他平台正常构建
  android-skip-notice:
    runs-on: ubuntu-latest
    needs: check-android-secret
    if: ${{ needs.check-android-secret.outputs.has_key != 'true' }}
    steps:
      - name: 提示跳过 Android 构建
        run: |
          echo "跳过 Android 构建：GitHub Variables 里缺 INFISICAL_IDENTITY_ID（Fork PR 无此变量），其他平台正常构建。"

  # ══════════════════════════════════════════
  # 1. Android 构建
  # ══════════════════════════════════════════
  build-android:
    # 需要 Infisical OIDC 拉签名材料，无 INFISICAL_IDENTITY_ID（Fork PR）时跳过整个 job
    needs: check-android-secret
    if: ${{ needs.check-android-secret.outputs.has_key == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 释放空间 (free-disk-space)
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: false
          large-packages: false
          docker-images: true
          preinstalled-runtimes: true
          swap-storage: false

      - name: 重建 Android SDK 目录
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android

      - name: 安装编译依赖 (LLVM/Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      - name: 从 Infisical 拉取签名密钥 (OIDC)
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: "oidc"
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG || 'prod' }}
          domain: "https://app.infisical.com"

      - name: 写入 Android 签名材料
        id: crypt
        run: |
          python3 script/android/prepare_signing_from_infisical.py
          echo "android_flavor=release" >> "$GITHUB_OUTPUT"
          echo "ANDROID_FLAVOR=release" >> "$GITHUB_ENV"

      - name: 设置 Java 21 & SDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      # compileSdk 37（androidx.core 1.19 起的 AAR metadata 要求）对应的平台与
      # build-tools 显式预装，避免 Gradle 构建时再临时下载
      - name: 安装 Android SDK Platform 37
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust (Android 目标)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 读取 NDK 版本配置
        id: ndk-config
        run: |
          NDK_VER=$(grep "ndkVersion" android/app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "ndk_version=$NDK_VER" >> $GITHUB_OUTPUT

      - name: 缓存 Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ steps.ndk-config.outputs.ndk_version }}
          key: ${{ runner.os }}-android-ndk-${{ steps.ndk-config.outputs.ndk_version }}

      - name: 安装 Android NDK
        run: yes | sdkmanager "ndk;${{ steps.ndk-config.outputs.ndk_version }}"

      - name: 安装 Android CMake
        run: yes | sdkmanager "cmake;3.22.1"

      - name: 设置 NDK 环境变量
        run: |
          NDK_VER=${{ steps.ndk-config.outputs.ndk_version }}
          ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VER"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # libwindcore.so 依赖 NDK 的 libc++_shared.so，但 native-assets 不会自动打包它。
      # jniLibs/ 被 .gitignore 忽略，CI checkout 里没有，缺了就会启动闪退。
      - name: 补齐 libc++_shared.so
        run: python3 script/android/prepare_android_libcpp_shared.py

      - name: 接受 Android Licenses
        run: yes | fvm flutter doctor --android-licenses || true

      - name: 拉取 Flutter 依赖
        run: fvm flutter pub get

      - name: 缓存 Android waifu2x CLI 依赖
        uses: actions/cache@v5
        with:
          path: third_party/android_ncnn_deps
          key: ${{ runner.os }}-android-waifu2x-deps-${{ hashFiles('script/android/prepare_android_waifu2x_deps.py', 'script/android/build_ncnn_static_android.py', 'script/android/build_waifu2x_cli_android.py', 'android/app/src/main/cpp/waifu2x_cli/CMakeLists.txt') }}

      - name: 缓存 ncnn 源码
        uses: actions/cache@v5
        with:
          path: third_party/ncnn-src
          key: ${{ runner.os }}-android-ncnn-src-${{ hashFiles('script/android/build_ncnn_static_android.py') }}

      - name: 缓存 RealSR-NCNN-Android 源码
        uses: actions/cache@v5
        with:
          path: third_party/RealSR-NCNN-Android
          key: ${{ runner.os }}-android-realsr-src-${{ hashFiles('script/android/build_waifu2x_cli_android.py') }}

      - name: 准备 Android waifu2x CLI 依赖
        run: |
          python3 script/android/prepare_android_waifu2x_deps.py

      - name: 编译 Android 静态 ncnn
        run: |
          python3 script/android/build_ncnn_static_android.py

      - name: 编译 Android waifu2x CLI
        run: |
          python3 script/android/build_waifu2x_cli_android.py

      - name: 准备 Android dav1d 交叉静态库
        uses: ./.github/actions/setup-dav1d-android
        # 配方只有这一份；release.yml 的 build-android 用的也是它

      - name: 运行 Android 构建脚本
        run: |
          # build_apk.dart 无参数=release 分 ABI；带任意参数=debug（--target-platform=android-arm64,android-x64）
          if [ "${ANDROID_FLAVOR:-release}" = debug ]; then
            fvm dart ./script/build/build_apk.dart debug
          else
            fvm dart ./script/build/build_apk.dart
          fi

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v6
        with:
          name: android-apks-${{ env.ANDROID_FLAVOR || 'release' }}
          path: |
            build/app/outputs/**/*.apk

  # ══════════════════════════════════════════
  # 2. Linux 构建
  # ══════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 设置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 安装 Flatpak 构建环境
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ninja-build libgtk-3-dev liblzma-dev libgcrypt20-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev libmpv-dev libdav1d-dev
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 构建 Linux + 可选上传符号 + 构建 Flatpak
        run: |
          fvm dart ./script/build/build_linux_flatpak.dart

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v6
        with:
          name: linux-flatpak
          path: breeze.flatpak

      - name: 构建 Linux .deb
        run: |
          sudo apt-get install -y dpkg-dev
          fvm dart ./script/build/build_linux_deb.dart --package-only

      - name: 上传 Linux deb
        uses: actions/upload-artifact@v6
        with:
          name: linux-deb
          path: build-deb/breeze_*.deb

  # ══════════════════════════════════════════
  # 3. Windows 构建
  # ══════════════════════════════════════════
  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - name: 关闭 Git CRLF 转换
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 设置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          fvm install && fvm use --force
          echo "$((Get-Item .).FullName)\.fvm\flutter_sdk\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 安装 Inno Setup 7
        shell: pwsh
        run: |
          $isccCandidates = @(
            "C:\Program Files\Inno Setup 7\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 7\ISCC.exe"
          )
          if ($isccCandidates | Where-Object { Test-Path $_ }) {
            Write-Host "Inno Setup 7 已安装"
            exit 0
          }
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.1-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe" -OutFile $installer
          $expected = "8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0"
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) {
            throw "Inno Setup 安装包 SHA256 校验失败"
          }
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          $deadline = (Get-Date).AddSeconds(120)
          while (-not ($isccCandidates | Where-Object { Test-Path $_ }) -and ((Get-Date) -lt $deadline)) {
            Start-Sleep -Seconds 2
          }
          if (-not ($isccCandidates | Where-Object { Test-Path $_ })) {
            throw "Inno Setup 7 安装失败"
          }

      - name: 准备 dav1d 与 pkg-config（Windows 原生资产前置）
        uses: ./.github/actions/setup-dav1d-windows
        # 配方只有这一份；release.yml 的 build-windows 用的也是它

      - name: 预编 rust/gpu_present（把 cargo 的真实报错放到日志上）
        uses: ./.github/actions/prebuild-rust-windows
        # 必须排在 setup-dav1d-windows 之后

      - name: 运行 Windows 构建脚本
        run: |
          fvm flutter pub get
          fvm dart ./script/build/build_windows.dart

      # flutter build windows 失败在 INSTALL.vcxproj 时，MSBuild 只把整条命令回显出来，
      # cmake_install.cmake 真正的报错（哪一行、拷不到哪个文件）被吞掉，日志里查不到原因。
      # 这里在失败后把同一件事直接跑一遍，让 cmake 自己把话说完整。
      - name: 诊断 cmake install 的真实报错（构建失败时）
        if: failure()
        run: |
          $ErrorActionPreference = 'Continue'
          $root = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64'
          if (-not (Test-Path $root)) { Write-Host "::error::没有 $root（没走到 CMake 生成阶段）"; exit 0 }
          Write-Host "=== 可疑的安装来源是否存在 ==="
          foreach ($p in @(
              (Join-Path $root 'native_assets\windows'),
              (Join-Path $root 'flutter_assets'),
              (Join-Path $root 'runner\Release'))) {
            if (Test-Path $p) {
              Write-Host "EXIST $p  条目数=$((Get-ChildItem -Recurse -File -ErrorAction SilentlyContinue $p).Count)"
            } else {
              Write-Host "MISSING $p"
            }
          }
          Write-Host "=== CMakeCache 里与 install 相关的键 ==="
          Select-String -Path (Join-Path $root 'CMakeCache.txt') `
            -Pattern 'AOT_LIBRARY|NATIVE_ASSETS|DAV1D|CMAKE_INSTALL_PREFIX|FLUTTER_LIBRARY|BUILD_TYPE' `
            -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Line }
          $vsCmake = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter cmake.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\CommonExtensions\\Microsoft\\CMake\\CMake\\bin\\cmake.exe$' } |
            Select-Object -First 1
          if ($vsCmake) {
            # 构建用的是 VS 自带的 CMake。上一版诊断让 PATH 上的 cmake 抢了（实际是 C:\Strawberry\c\bin），
            # 于是同一段脚本报成 warning、rc=0，与 MSBuild 里的 exit 1 对不上 —— 复现必须用同一个二进制。
            $cmake = $vsCmake.FullName
          } else {
            $cmake = (Get-Command cmake -ErrorAction SilentlyContinue).Source
          }
          if (-not $cmake) {
            $cmake = 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          }
          Write-Host "=== 用 cmake=$cmake 直接重跑 install ==="
          Push-Location $root
          & $cmake -DBUILD_TYPE=Release -P cmake_install.cmake 2>&1 | ForEach-Object { Write-Host $_ }
          Write-Host "CMAKE_INSTALL_RC=$LASTEXITCODE"
          # 报错会给出行号，这里把脚本连行号一起打出来，行号就能直接对上内容。
          Write-Host "=== cmake_install.cmake（带行号） ==="
          Select-String -Path (Join-Path $root 'cmake_install.cmake') -Pattern '.' `
            -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "$($_.LineNumber): $($_.Line)" }
          Write-Host "=== native_assets 目录实际内容 ==="
          Get-ChildItem -Recurse -File (Join-Path $root 'native_assets') -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }
          Pop-Location

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe
          path: build/windows/installer/windows-installer.exe

      # - name: 运行 Windows 构建脚本
      #   run: |
      #     fvm flutter pub get
      #     fvm dart ./script/build/build_windows.dart --prepare-only

      # - name: 上传未签名 Windows 主程序
      #   id: upload-zephyr
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: zephyr-exe
      #     path: build/windows/x64/runner/Release/zephyr.exe

      # - name: SignPath 签名 Windows 主程序
      #   id: sign-zephyr
      #   uses: SignPath/github-action-submit-signing-request@v2
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: f3cf3aed-f869-41ec-95c1-27dbd2926618
      #     project-slug: Breeze
      #     signing-policy-slug: test-signing
      #     artifact-configuration-slug: windows-app-exe
      #     github-artifact-id: ${{ steps.upload-zephyr.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: ${{ runner.temp }}\signed-zephyr

      # - name: 回灌已签名 Windows 主程序
      #   shell: pwsh
      #   run: |
      #     Copy-Item -Force "${{ runner.temp }}\signed-zephyr\zephyr.exe" "build/windows/x64/runner/Release/zephyr.exe"

      # - name: 继续构建 Windows 安装器
      #   run: |
      #     fvm dart ./script/build/build_windows.dart --package-only

      # - name: 上传未签名 Windows 安装器
      #   id: upload-installer
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: windows-installer-exe
      #     path: build/windows/installer/windows-installer.exe

      # - name: SignPath 签名 Windows 安装器
      #   id: sign-installer
      #   uses: SignPath/github-action-submit-signing-request@v2
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: f3cf3aed-f869-41ec-95c1-27dbd2926618
      #     project-slug: Breeze
      #     signing-policy-slug: test-signing
      #     artifact-configuration-slug: windows-installer-exe
      #     github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: ${{ runner.temp }}\signed-installer

      # - name: 回灌已签名 Windows 安装器
      #   shell: pwsh
      #   run: |
      #     Copy-Item -Force "${{ runner.temp }}\signed-installer\windows-installer.exe" "build/windows/installer/windows-installer.exe"

      # - name: 上传已签名 Windows 安装器
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: windows-installer-signed
      #     path: build/windows/installer/windows-installer.exe

  # ══════════════════════════════════════════
  # 4. macOS 构建
  # ══════════════════════════════════════════
  build-macos:
    runs-on: macos-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 安装打包依赖 (create-dmg)
        run: brew install create-dmg

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: 校验并修复 rustup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"

          echo "which rustup: $(which rustup || true)"
          ls -l "$CARGO_HOME/bin"/rustup* || true

          if ! rustup --version || ! rustup toolchain list; then
            echo "Detected invalid rustup binary, reinstalling..."
            rm -f "$CARGO_HOME/bin/rustup" "$CARGO_HOME/bin/rustup-init"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
            export PATH="$CARGO_HOME/bin:$PATH"
            rustup --version
            rustup toolchain list
          fi

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 拉取依赖 & 修复 Podfile
        run: |
          fvm flutter pub get
          if [ -f "macos/Podfile" ]; then
            sed -i '' "s/platform :osx, '[0-9.]*'/platform :osx, '15.0'/g" macos/Podfile
            ruby -i -pe '
              if /flutter_additional_macos_build_settings\(target\)/
                $_ += "      target.build_configurations.each do |config|\n        config.build_settings[\"MACOSX_DEPLOYMENT_TARGET\"] = \"15.0\"\n      end\n"
              end
            ' macos/Podfile
          fi

      - name: 诊断 coreml_upscale 的 Swift 编译（完整 note 级诊断）
        continue-on-error: true
        run: |
          # flutter/xcodebuild 这条路只显示 error 行，不给候选签名，已经连着猜错两次
          # （抬最低系统版本、Swift.Float16 限定 —— 报错一字未变）。
          # 这里用 runner 默认 Xcode 单独 typecheck 那批源码，把 note 全打出来。
          xcode-select -p
          xcodebuild -version
          ls packages/coreml_upscale/macos/Classes/*.swift
          xcrun swiftc -typecheck \
            -target arm64-apple-macos15.0 \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -import-objc-header /dev/null \
            packages/coreml_upscale/macos/Classes/*.swift 2>&1 | head -80
          echo "[rossi-diag] exit=$?"

      - name: 准备 dav1d 与 pkg-config（macOS 原生资产前置）
        uses: ./.github/actions/setup-dav1d-macos
        # 配方只有这一份；release.yml 的 build-macos 用的也是它

      - name: 编译 macOS 产物
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain list
          fvm flutter build macos --release --split-debug-info=build/symbols

      - name: 制作 DMG
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Failed to find built .app"
            exit 1
          fi

          APP_NAME=$(basename "$APP_PATH")
          rm -f "Breeze-macOS.dmg"
          create-dmg \
            --volname "Breeze Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 150 190 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 450 190 \
            "Breeze-macOS.dmg" \
            "$APP_PATH"

      - name: 上传 macOS DMG
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: Breeze-macOS.dmg

  # ══════════════════════════════════════════
  # 5. iOS 构建 (免签)
  # ══════════════════════════════════════════
  build-ios:
    runs-on: macos-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 校验并修复 rustup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"

          echo "which rustup: $(which rustup || true)"
          ls -l "$CARGO_HOME/bin"/rustup* || true

          if ! rustup --version || ! rustup toolchain list; then
            echo "Detected invalid rustup binary, reinstalling..."
            rm -f "$CARGO_HOME/bin/rustup" "$CARGO_HOME/bin/rustup-init"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
            export PATH="$CARGO_HOME/bin:$PATH"
            rustup --version
            rustup toolchain list
          fi

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 准备 iOS dav1d 静态库
        run: |
          set -euo pipefail
          brew install meson nasm pkg-config
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          PREFIX="$PWD/third_party/ios_sysroot/aarch64-apple-ios"
          SRC="$PWD/third_party/dav1d-src"
          if [ ! -d "$SRC/.git" ]; then
            git clone --depth 1 -b 1.5.0 https://code.videolan.org/videolan/dav1d.git "$SRC"
          fi
          INI="$PWD/third_party/meson-ios.ini"
          cat > "$INI" <<EOF
          [binaries]
          c = ['xcrun', '--sdk', 'iphoneos', 'clang']
          cpp = ['xcrun', '--sdk', 'iphoneos', 'clang++']
          ar = ['xcrun', '--sdk', 'iphoneos', 'ar']
          strip = ['xcrun', '--sdk', 'iphoneos', 'strip']
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args = ['-arch', 'arm64', '-isysroot', '$SDKROOT', '-miphoneos-version-min=16.0']
          c_link_args = ['-arch', 'arm64', '-isysroot', '$SDKROOT', '-miphoneos-version-min=16.0']
          EOF
          rm -rf "$SRC/build-ios-aarch64" "$PREFIX"
          meson setup "$SRC/build-ios-aarch64" "$SRC" \
            --cross-file "$INI" \
            --prefix "$PREFIX" \
            --libdir lib \
            --default-library=static \
            -Denable_tests=false -Denable_examples=false -Denable_tools=false \
            -Dbitdepths="['8', '16']"
          ninja -C "$SRC/build-ios-aarch64"
          meson install -C "$SRC/build-ios-aarch64"

      - name: 编译 iOS (无签)
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/third_party/ios_sysroot/aarch64-apple-ios/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CARGO_TARGET_AARCH64_APPLE_IOS_LINKER="$(xcrun --sdk iphoneos --find clang)"
          export IPHONEOS_DEPLOYMENT_TARGET="16.0"
          export CFLAGS_aarch64_apple_ios="-miphoneos-version-min=$IPHONEOS_DEPLOYMENT_TARGET -isysroot $SDKROOT"
          export CXXFLAGS_aarch64_apple_ios="$CFLAGS_aarch64_apple_ios"
          export CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS="-C link-arg=-miphoneos-version-min=$IPHONEOS_DEPLOYMENT_TARGET"
          export RUSTFLAGS="$CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS"
          rm -f rust/.cargo/config.toml
          echo "--- CARGO_TARGET_AARCH64_APPLE_IOS_LINKER ---"
          printf '%s\n' "$CARGO_TARGET_AARCH64_APPLE_IOS_LINKER"
          echo "--- SDKROOT ---"
          printf '%s\n' "$SDKROOT"
          echo "--- IPHONEOS_DEPLOYMENT_TARGET ---"
          printf '%s\n' "${IPHONEOS_DEPLOYMENT_TARGET:-<unset>}"
          echo "--- RUSTFLAGS ---"
          printf '%s\n' "${RUSTFLAGS:-<unset>}"
          echo "--- CFLAGS_aarch64_apple_ios ---"
          printf '%s\n' "${CFLAGS_aarch64_apple_ios:-<unset>}"
          rustup toolchain list
          fvm flutter precache --ios
          fvm flutter pub get
          # 动态修改 pbxcproj，关闭整个项目的强签名要求：
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          fvm flutter build ios --release --no-codesign --split-debug-info=build/symbols

      - name: 封装 IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "Breeze-iOS.ipa" Payload

      - name: 上传 iOS IPA
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa
          path: Breeze-iOS.ipa
