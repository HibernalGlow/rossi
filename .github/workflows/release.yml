name: Breeze Multi-Platform Parallel Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号 vX.Y.Z；留空则读 pubspec.yaml。preflight 会先校验 CHANGELOG 段落与 tag，不合格立刻红"
        required: false
        default: ""

permissions:
  contents: write

env:
  MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
  BREEZE_PLUGIN_GITHUB_TOKEN: ${{ secrets.BREEZE_PLUGIN_GITHUB_TOKEN != '' &&
    secrets.BREEZE_PLUGIN_GITHUB_TOKEN || github.token }}

jobs:
  # Fork 仓库通常没有签名/发布 secrets。job 级 if 读不到 secrets，先在 step 内检测：
  # 缺 GIT_CRYPT_KEY 跳过 Android，缺 HOMEBREW_GITHUB_TOKEN 跳过 Homebrew 更新。
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_git_crypt: ${{ steps.gitcrypt.outputs.has }}
      has_homebrew: ${{ steps.homebrew.outputs.has }}
    steps:
      - name: 检查 GIT_CRYPT_KEY
        id: gitcrypt
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if [ -n "$GIT_CRYPT_KEY" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 检查 HOMEBREW_GITHUB_TOKEN
        id: homebrew
        env:
          HOMEBREW_GITHUB_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_GITHUB_TOKEN" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

  # ══════════════════════════════════════════
  # 0. 版本与发布前置校验（排在所有构建之前）
  # ══════════════════════════════════════════
  # 为什么要这一 job：以前版本号只在 publish 里第一次被读到。填错版本、或 CHANGELOG 少一段，
  # 要等四条腿跑满 30 分钟构建分钟，才在 Release 正文里静默抓出一段空文本。
  # 现在把这些判据前移到开跑之前，不合格就立刻红，并把原因写在步骤日志里。
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: 解析并校验版本号
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            # 留空即读 pubspec.yaml：`version: 0.1.2+1` -> v0.1.2（+1 是 build 号，不进 tag）
            RAW="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
            if [ -z "$RAW" ]; then
              echo "::error::pubspec.yaml 里没读到 version: 行，无法推导版本号 —— 请手填 vX.Y.Z"
              exit 1
            fi
            VERSION="v${RAW%%+*}"
            echo "[preflight] 输入留空 ⇒ 从 pubspec.yaml 的 $RAW 推导版本号 $VERSION"
          fi
          # 允许不带前缀 v 的写法（0.1.2 -> v0.1.2），免得每次都要想格式
          case "$VERSION" in
            v*) : ;;
            *) VERSION="v$VERSION" ;;
          esac
          if ! printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([._-][0-9A-Za-z._-]+)?$'; then
            echo "::error::版本号形状不合格：'$VERSION'（要 vX.Y.Z，或整段留空由 pubspec 推导）"
            exit 1
          fi

          # 正文来源与 publish 里那段 awk 用同一把尺：判据不一致就等于没有判据。
          SECTION="$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 {flag=1; print; next}
            flag && /^## \[[^]]+\]/ {exit}
            flag
          ' CHANGELOG.md)"
          if [ -z "$SECTION" ]; then
            echo "::error::CHANGELOG.md 里没有 ## [$VERSION] 段落 —— Release 正文会只剩下载表格。现有段落（最后 5 条）："
            grep -E '^## \[' CHANGELOG.md | tail -5 || echo "  (CHANGELOG 里一条 ## [x] 标题都没有)"
            exit 1
          fi
          BODY_LINES="$(printf '%s\n' "$SECTION" | grep -Ec '^[^#[:space:]].*[^[:space:]]' || true)"
          if [ "${BODY_LINES:-0}" -lt 1 ]; then
            echo "::error::CHANGELOG.md 的 ## [$VERSION] 段只有标题、没有内容，不予发布"
            exit 1
          fi

          # tag 与产物必须同源：softprops 只会在 tag 不存在时于本次提交建 tag，
          # 已存在就挂在原处 —— 那时包体来自本次运行，tag 却指向旧提交。
          # 判据要能证伪：只有明确的 404 才算「不存在」，其它非 200 一律红，
          # 免得查询本身挂掉时被当成「没有 tag」而放过一次错位发布。
          CODE="$(curl -sS -o "$RUNNER_TEMP/ref.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" || echo 000)"
          case "$CODE" in
            404) EXISTING="" ;;
            200)
              TYPE="$(jq -r '.object.type // empty' "$RUNNER_TEMP/ref.json")"
              SHA="$(jq -r '.object.sha // empty' "$RUNNER_TEMP/ref.json")"
              if [ "$TYPE" = "tag" ]; then
                # 附注 tag 的 ref 指向 tag 对象，直接拿来和 github.sha 比会永远不等 ⇒ 假红。
                # 必须先解引用到它包裹的 commit（v0.1.1 就是附注 tag，实测 ref 返回 84a4551c 而非 0e632075）。
                URL="$(jq -r '.object.url // empty' "$RUNNER_TEMP/ref.json")"
                SHA="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$URL" | jq -r '.object.sha // empty')"
                if [ -z "$SHA" ]; then
                  echo "::error::附注 tag $VERSION 解引用失败，无法判断它指向哪个提交，不予放行。"
                  exit 1
                fi
              fi
              EXISTING="$SHA"
              ;;
            *)
              echo "::error::查询 tag $VERSION 失败（HTTP $CODE），无法判断它指向哪个提交，不予放行。"
              exit 1
              ;;
          esac
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "$RUN_SHA" ]; then
            echo "::error::tag $VERSION 已存在且指向 ${EXISTING:0:10}，与本次运行的 $RUN_SHA 不一致。"
            echo "  本次会发出「产物来自 A、tag 指向 B」的 Release。要么把 tag 挪到本次提交，要么换版本号。"
            exit 1
          fi

          {
            echo "## 发布前置校验通过"
            echo ""
            echo "- 版本号：**$VERSION**（输入$( [ -z "$INPUT_VERSION" ] && echo 留空，读 pubspec.yaml || echo 手填 )）"
            echo "- CHANGELOG 段落：${BODY_LINES} 行正文"
            if [ -n "$EXISTING" ]; then
              echo "- tag：已存在且就是本次提交"
            else
              echo "- tag：尚不存在，publish 会在本次提交上创建"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "[preflight] 通过：version=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ══════════════════════════════════════════
  # 1. Android 构建 (含 git-crypt & Sentry)
  # ══════════════════════════════════════════
  build-android:
    needs: [ preflight, check-secrets ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 释放空间 (Nuclear Mode)
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/codeql
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android 
          docker system prune -a -f
          sudo apt-get clean

      # 以下两步与 push-build.yml 的 build-android 同源：rquickjs 的 bindgen 要 libclang，
      # 交叉编 dav1d 要 meson/ninja/nasm + NDK cross file。release 这条腿以前两步都没有，
      # 于是钩子在 armv7 上直接报 failed to run custom build command for `dav1d-sys v0.8.3`。
      # 注意 dav1d 那一步不能放在这里：它要 $ANDROID_HOME/ndk/<ver> 已经装好，
      # 而 NDK 是后面「安装 Android NDK」才落的（实测放早了会报「找不到 NDK 工具链目录」）。
      - name: 安装编译依赖 (LLVM/Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      - name: 解密敏感文件 (git-crypt)
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if [ -z "$GIT_CRYPT_KEY" ]; then
            # 本仓是独立 fork，没有 GIT_CRYPT_KEY 这个 secret。以前整条 Android 腿被
            # `if: has_git_crypt` 直接跳过，于是 Release 里永远没有 APK。
            # 现在照常出包：android/app/build.gradle.kts 的 releaseSigningAvailable 探到
            # key.properties 未解锁时，release 构建回退 debug 签名 —— 装得上也能跑，只是不是发布 key。
            echo "未配置 GIT_CRYPT_KEY：跳过解密，release 构建将回退 debug 签名（fork 的既成口径）。"
          else
            sudo apt-get update && sudo apt-get install -y git-crypt
            echo "$GIT_CRYPT_KEY" | base64 -d > ./git-crypt-key
            git-crypt unlock ./git-crypt-key && rm ./git-crypt-key
          fi
          # 无论走哪条路，都把 gradle 用来决定签名的判据当场读一遍，
          # 别让「其实没解密」变成跑完 30 分钟才从安装包签名上看出来的秘密。
          if [ -f android/key.properties ] && grep -q '^keyAlias=' android/key.properties; then
            echo "[rossi-android] key.properties 可读 ⇒ release 用发布 key 签名"
          else
            echo "[rossi-android] key.properties 未解锁或缺 keyAlias ⇒ release 回退 debug 签名"
          fi

      - name: 设置 Java 21 & SDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust (Android 目标)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 读取 NDK 版本配置
        id: ndk-config
        run: |
          NDK_VER=$(grep "ndkVersion" android/app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "ndk_version=$NDK_VER" >> $GITHUB_OUTPUT

      - name: 缓存 Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ steps.ndk-config.outputs.ndk_version }}
          key: ${{ runner.os }}-android-ndk-${{ steps.ndk-config.outputs.ndk_version }}

      - name: 安装 Android NDK
        run: yes | sdkmanager "ndk;${{ steps.ndk-config.outputs.ndk_version }}"

      - name: 安装 Android CMake
        run: yes | sdkmanager "cmake;3.22.1"

      - name: 设置 NDK 环境变量
        run: |
          NDK_VER=${{ steps.ndk-config.outputs.ndk_version }}
          ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VER"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 接受 Android Licenses
        run: yes | fvm flutter doctor --android-licenses || true

      - name: 拉取 Flutter 依赖
        run: fvm flutter pub get

      - name: 缓存 Android waifu2x CLI 依赖
        uses: actions/cache@v5
        with:
          path: third_party/android_ncnn_deps
          key: ${{ runner.os }}-android-waifu2x-deps-${{ hashFiles('script/android/prepare_android_waifu2x_deps.py', 'script/android/build_ncnn_static_android.py', 'script/android/build_waifu2x_cli_android.py', 'android/app/src/main/cpp/waifu2x_cli/CMakeLists.txt') }}

      - name: 缓存 ncnn 源码
        uses: actions/cache@v5
        with:
          path: third_party/ncnn-src
          key: ${{ runner.os }}-android-ncnn-src-${{ hashFiles('script/android/build_ncnn_static_android.py') }}

      - name: 缓存 RealSR-NCNN-Android 源码
        uses: actions/cache@v5
        with:
          path: third_party/RealSR-NCNN-Android
          key: ${{ runner.os }}-android-realsr-src-${{ hashFiles('script/android/build_waifu2x_cli_android.py') }}

      - name: 准备 Android waifu2x CLI 依赖
        run: |
          python3 script/android/prepare_android_waifu2x_deps.py

      - name: 编译 Android 静态 ncnn
        run: |
          python3 script/android/build_ncnn_static_android.py

      - name: 编译 Android waifu2x CLI
        run: |
          python3 script/android/build_waifu2x_cli_android.py

      - name: 准备 Android dav1d 交叉静态库
        uses: ./.github/actions/setup-dav1d-android

      - name: 运行 Android 构建脚本
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          fvm dart ./script/build/build_apk.dart

      - name: 上传 Android 符号表到 Sentry（可选）
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "未配置 SENTRY_AUTH_TOKEN，跳过 Android 符号表上传。"
            exit 0
          fi
          fvm dart run sentry_dart_plugin --sentry-define=auth_token="$SENTRY_AUTH_TOKEN"

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v6
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/skia/*.apk

  # ══════════════════════════════════════════
  # 2. Linux 构建 (Sentry Plugin 上传 + Flatpak + DEB)
  # ══════════════════════════════════════════
  build-linux:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 设置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 安装 Flatpak 构建环境
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ninja-build libgtk-3-dev liblzma-dev libgcrypt20-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev libmpv-dev libdav1d-dev
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 构建 Linux + 可选上传符号 + 构建 Flatpak
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          fvm dart ./script/build/build_linux_flatpak.dart

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v6
        with:
          name: linux-flatpak
          path: breeze.flatpak

      - name: 构建 Linux .deb
        run: |
          sudo apt-get install -y dpkg-dev
          fvm dart ./script/build/build_linux_deb.dart --package-only

      - name: 上传 Linux deb
        uses: actions/upload-artifact@v6
        with:
          name: linux-deb
          path: build-deb/breeze_*.deb

  # ══════════════════════════════════════════
  # 3. Windows 构建 (Sentry Plugin 上传)
  # ══════════════════════════════════════════
  build-windows:
    needs: preflight
    runs-on: windows-2025-vs2026
    steps:
      - name: 关闭 Git CRLF 转换
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 设置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          fvm install && fvm use --force
          echo "$((Get-Item .).FullName)\.fvm\flutter_sdk\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust/Tauri 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            windows-installer/src-tauri

      - name: 设置 Node.js & pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 这两步与 push-build.yml 共用同一份 action —— 过去 dav1d 前置只进了 push-build.yml，
      # release.yml 的 Windows 腿因此连着红了两次（dav1d-sys 的 custom build command 失败）。
      - name: 准备 dav1d 与 pkg-config（Windows 原生资产前置）
        uses: ./.github/actions/setup-dav1d-windows

      - name: 预编 rust/gpu_present（把 cargo 的真实报错放到日志上）
        uses: ./.github/actions/prebuild-rust-windows

      - name: 运行 Windows 构建脚本
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          fvm flutter pub get
          fvm dart ./script/build/build_windows.dart

      - name: 上传 Windows 符号表到 Sentry（可选）
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SENTRY_AUTH_TOKEN)) {
            Write-Host "未配置 SENTRY_AUTH_TOKEN，跳过 Windows 符号表上传。"
            exit 0
          }
          fvm dart run sentry_dart_plugin --sentry-define=auth_token="$env:SENTRY_AUTH_TOKEN"

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe
          path: windows-installer/src-tauri/target/release/windows-installer.exe

  # ══════════════════════════════════════════
  # 4. macOS 构建 (Sentry Plugin 上传)
  # ══════════════════════════════════════════
  build-macos:
    needs: preflight
    runs-on: macos-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 安装打包依赖 (create-dmg)
        run: brew install create-dmg

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: 校验并修复 rustup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"

          echo "which rustup: $(which rustup || true)"
          ls -l "$CARGO_HOME/bin"/rustup* || true

          if ! rustup --version || ! rustup toolchain list; then
            echo "Detected invalid rustup binary, reinstalling..."
            rm -f "$CARGO_HOME/bin/rustup" "$CARGO_HOME/bin/rustup-init"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
            export PATH="$CARGO_HOME/bin:$PATH"
            rustup --version
            rustup toolchain list
          fi

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 拉取依赖 & 修复 Podfile
        run: |
          fvm flutter pub get
          if [ -f "macos/Podfile" ]; then
            sed -i '' "s/platform :osx, '[0-9.]*'/platform :osx, '15.0'/g" macos/Podfile
            ruby -i -pe '
              if /flutter_additional_macos_build_settings\(target\)/
                $_ += "      target.build_configurations.each do |config|\n        config.build_settings[\"MACOSX_DEPLOYMENT_TARGET\"] = \"15.0\"\n      end\n"
              end
            ' macos/Podfile
          fi

      # 与 push-build.yml 共用同一份配方：干净 runner 上没有 dav1d 时，
      # windcore 链接期直接 ld: library 'dav1d' not found（release.yml 的 macOS 腿就栽在这）。
      - name: 准备 dav1d 与 pkg-config（macOS 原生资产前置）
        uses: ./.github/actions/setup-dav1d-macos

      - name: 编译 macOS 产物
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain list
          fvm flutter build macos --release --dart-define=sentry_dsn=$SENTRY_DSN --split-debug-info=build/symbols

      - name: 上传 macOS 符号表到 Sentry（可选）
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "未配置 SENTRY_AUTH_TOKEN，跳过 macOS 符号表上传。"
            exit 0
          fi
          fvm dart run sentry_dart_plugin --sentry-define=auth_token="$SENTRY_AUTH_TOKEN"

      - name: 制作 DMG
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          APP_NAME=$(basename "$APP_PATH")
          rm -f "Breeze-macOS.dmg"
          create-dmg \
            --volname "Breeze Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 150 190 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 450 190 \
            "Breeze-macOS.dmg" \
            "$APP_PATH"

      - name: 上传 macOS DMG
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: Breeze-macOS.dmg

  # ══════════════════════════════════════════
  # 5. iOS 构建 (免签 + Sentry Plugin 上传)
  # ══════════════════════════════════════════
  build-ios:
    needs: preflight
    runs-on: macos-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 校验并修复 rustup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"

          echo "which rustup: $(which rustup || true)"
          ls -l "$CARGO_HOME/bin"/rustup* || true

          if ! rustup --version || ! rustup toolchain list; then
            echo "Detected invalid rustup binary, reinstalling..."
            rm -f "$CARGO_HOME/bin/rustup" "$CARGO_HOME/bin/rustup-init"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --no-modify-path
            export PATH="$CARGO_HOME/bin:$PATH"
            rustup --version
            rustup toolchain list
          fi

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 准备 iOS dav1d 静态库
        run: |
          set -euo pipefail
          brew install meson nasm pkg-config
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          PREFIX="$PWD/third_party/ios_sysroot/aarch64-apple-ios"
          SRC="$PWD/third_party/dav1d-src"
          if [ ! -d "$SRC/.git" ]; then
            git clone --depth 1 -b 1.5.0 https://code.videolan.org/videolan/dav1d.git "$SRC"
          fi
          INI="$PWD/third_party/meson-ios.ini"
          cat > "$INI" <<EOF
          [binaries]
          c = ['xcrun', '--sdk', 'iphoneos', 'clang']
          cpp = ['xcrun', '--sdk', 'iphoneos', 'clang++']
          ar = ['xcrun', '--sdk', 'iphoneos', 'ar']
          strip = ['xcrun', '--sdk', 'iphoneos', 'strip']
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true

          [built-in options]
          c_args = ['-arch', 'arm64', '-isysroot', '$SDKROOT', '-miphoneos-version-min=16.0']
          c_link_args = ['-arch', 'arm64', '-isysroot', '$SDKROOT', '-miphoneos-version-min=16.0']
          EOF
          rm -rf "$SRC/build-ios-aarch64" "$PREFIX"
          meson setup "$SRC/build-ios-aarch64" "$SRC" \
            --cross-file "$INI" \
            --prefix "$PREFIX" \
            --libdir lib \
            --default-library=static \
            -Denable_tests=false -Denable_examples=false -Denable_tools=false \
            -Dbitdepths="['8', '16']"
          ninja -C "$SRC/build-ios-aarch64"
          meson install -C "$SRC/build-ios-aarch64"

      - name: 编译 iOS (无签)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/third_party/ios_sysroot/aarch64-apple-ios/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CARGO_TARGET_AARCH64_APPLE_IOS_LINKER="$(xcrun --sdk iphoneos --find clang)"
          export IPHONEOS_DEPLOYMENT_TARGET="16.0"
          export CFLAGS_aarch64_apple_ios="-miphoneos-version-min=$IPHONEOS_DEPLOYMENT_TARGET -isysroot $SDKROOT"
          export CXXFLAGS_aarch64_apple_ios="$CFLAGS_aarch64_apple_ios"
          export CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS="-C link-arg=-miphoneos-version-min=$IPHONEOS_DEPLOYMENT_TARGET"
          export RUSTFLAGS="$CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS"
          rm -f rust/.cargo/config.toml
          echo "--- CARGO_TARGET_AARCH64_APPLE_IOS_LINKER ---"
          printf '%s\n' "$CARGO_TARGET_AARCH64_APPLE_IOS_LINKER"
          echo "--- SDKROOT ---"
          printf '%s\n' "$SDKROOT"
          echo "--- IPHONEOS_DEPLOYMENT_TARGET ---"
          printf '%s\n' "${IPHONEOS_DEPLOYMENT_TARGET:-<unset>}"
          echo "--- RUSTFLAGS ---"
          printf '%s\n' "${RUSTFLAGS:-<unset>}"
          echo "--- CFLAGS_aarch64_apple_ios ---"
          printf '%s\n' "${CFLAGS_aarch64_apple_ios:-<unset>}"
          rustup toolchain list
          fvm flutter precache --ios
          fvm flutter pub get
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          fvm flutter build ios --release --no-codesign --dart-define=sentry_dsn=$SENTRY_DSN --split-debug-info=build/symbols

      - name: 上传 iOS 符号表到 Sentry（可选）
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "未配置 SENTRY_AUTH_TOKEN，跳过 iOS 符号表上传。"
            exit 0
          fi
          fvm dart run sentry_dart_plugin --sentry-define=auth_token="$SENTRY_AUTH_TOKEN"

      - name: 封装 IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "Breeze-iOS.ipa" Payload

      - name: 上传 iOS IPA
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa
          path: Breeze-iOS.ipa

  # ══════════════════════════════════════════
  # 6. 汇总发布至 GitHub Release
  # ══════════════════════════════════════════
  publish:
    needs: [ preflight, build-android, build-linux, build-windows, build-macos, build-ios ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 下载所有构建产物
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets

      - name: 重命名产物文件（追加版本后缀）
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          find release-assets -type f | while IFS= read -r file; do
            dir="$(dirname "$file")"
            name="$(basename "$file")"
            ext="${name##*.}"
            base="${name%.*}"
            newname="${base}-${VERSION}.${ext}"
            mv "$file" "$dir/$newname"
            echo "Renamed: $name -> $newname"
          done

      - name: 提取日志并准备 Release 内容
        id: prepare
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          REPO: ${{ github.repository }}
        run: |

          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 {flag=1; print; next}
            flag && /^## \[[^]]+\]/ {exit}
            flag
          ' CHANGELOG.md > changelog_section.txt

          echo "## 📝 更新日志" > release_body.md
          cat changelog_section.txt >> release_body.md
          echo -e "\n---\n" >> release_body.md
          echo "### 📦 推荐下载" >> release_body.md
          echo "| 平台 | 下载链接 |" >> release_body.md
          echo "| :--- | :--- |" >> release_body.md
          echo "| **Windows** | [windows-installer-${VERSION}.exe](https://github.com/$REPO/releases/download/$VERSION/windows-installer-${VERSION}.exe) |" >> release_body.md
          echo "| **macOS** | [Breeze-macOS-${VERSION}.dmg](https://github.com/$REPO/releases/download/$VERSION/Breeze-macOS-${VERSION}.dmg) |" >> release_body.md
          if find release-assets/android-apks -type f -name '*.apk' | grep -q .; then
            echo "| **Android** | [app-arm64-v8a-release-${VERSION}.apk](https://github.com/$REPO/releases/download/$VERSION/app-arm64-v8a-release-${VERSION}.apk) |" >> release_body.md
          fi
          echo "| **iOS** | [Breeze-iOS-${VERSION}.ipa](https://github.com/$REPO/releases/download/$VERSION/Breeze-iOS-${VERSION}.ipa) |" >> release_body.md
          echo "| **Linux** | [breeze-${VERSION}.flatpak](https://github.com/$REPO/releases/download/$VERSION/breeze-${VERSION}.flatpak) |" >> release_body.md
          DEB_FILE_NAME=$(find release-assets/linux-deb -type f -name "*.deb" -printf "%f\n" | head -n 1)
          if [ -z "$DEB_FILE_NAME" ]; then
            echo "未找到 Linux DEB 产物。"
            exit 1
          fi
          echo "| **Linux (DEB)** | [$DEB_FILE_NAME](https://github.com/$REPO/releases/download/$VERSION/$DEB_FILE_NAME) |" >> release_body.md
          echo -e "\n> 💡 **不知道该下载哪个文件？**\n> 请查看 [详细安装指南](https://github.com/$REPO#-%E5%A6%82%E4%BD%95%E5%AE%89%E8%A3%85)。" >> release_body.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ needs.preflight.outputs.version }}
          # 必须钉在本次构建的提交上：softprops 的 target_commitish 默认是 main，
          # 而构建要跑 40 分钟，期间只要有人往 main 推过东西，tag 就会落在别人的提交上，
          # 变成「产物来自 A、tag 指向 B」。v0.1.2 第一次发布就是这么指到了文档提交（fc86278d9）。
          target_commitish: ${{ github.sha }}
          name: Breeze ${{ needs.preflight.outputs.version }}
          body_path: release_body.md
          files: |
            release-assets/android-apks/**/*.apk
            release-assets/linux-flatpak/*.flatpak
            release-assets/linux-deb/*.deb
            release-assets/windows-exe/*.exe
            release-assets/macos-dmg/*.dmg
            release-assets/ios-ipa/*.ipa

      - name: 发送 Release 到 Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "未配置 TELEGRAM_BOT_TOKEN 或 TELEGRAM_CHAT_ID，跳过 Telegram 通知。"
            exit 0
          fi

          RELEASE_URL="https://github.com/${REPO}/releases/tag/${VERSION}"
          BODY="$(awk 'BEGIN{p=1} /^---$/ {exit} {print}' release_body.md)"
          TEXT="🚀 ${REPO} 发布新版本
          版本: ${VERSION}
          链接: ${RELEASE_URL}

          ${BODY}"

          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true"

          mapfile -t files < <(find release-assets -type f \( -name "*.apk" -o -name "*.flatpak" -o -name "*.deb" -o -name "*.exe" -o -name "*.dmg" -o -name "*.ipa" \) | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "未找到可发送附件，跳过。"
            exit 0
          fi

          for file in "${files[@]}"; do
            name="$(basename "$file")"
            echo "Uploading ${name} to Telegram"
            curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F "chat_id=${CHAT_ID}" \
              -F "caption=${name}" \
              -F "document=@${file}"
          done

  # ══════════════════════════════════════════
  # 7. 自动更新 Homebrew Tap (仅限 macOS Cask)
  # ══════════════════════════════════════════
  update-homebrew:
    needs: [ publish, preflight, check-secrets ]
    if: ${{ needs.check-secrets.outputs.has_homebrew == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出 Homebrew Tap 仓库
        uses: actions/checkout@v5
        with:
          repository: deretame/homebrew-Breeze
          token: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
          path: homebrew-Breeze

      - name: 下载 macOS 产物并计算 SHA256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          CLEAN_VERSION="${VERSION#v}"
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV

          gh release download "$VERSION" --repo "${{ github.repository }}" --pattern "Breeze-macOS-${VERSION}.dmg"

          DMG_SHA256=$(sha256sum Breeze-macOS-${VERSION}.dmg | awk '{ print $1 }')
          echo "DMG_SHA256: $DMG_SHA256"
          echo "DMG_SHA256=$DMG_SHA256" >> $GITHUB_ENV

      - name: 更新 Homebrew Cask 文件并清理无用 Formula
        working-directory: ./homebrew-Breeze
        run: |
          # 1. 精准更新 macOS 的 Cask 文件
          CASK_FILE="Casks/breeze.rb"
          if [ -f "$CASK_FILE" ]; then
            sed -i "s/version \".*\"/version \"$CLEAN_VERSION\"/" "$CASK_FILE"
            sed -i "s/sha256 \".*\"/sha256 \"$DMG_SHA256\"/" "$CASK_FILE"
            sed -i 's@/Breeze-macOS\.dmg"@/Breeze-macOS-#{version}.dmg"@' "$CASK_FILE"
            echo "已成功更新 $CASK_FILE"
          else
            echo "错误：未找到真正的 Cask 文件 $CASK_FILE"
            exit 1
          fi

          # 2. 彻底删除那个毫无意义的 Android APK 占位 Formula
          FORMULA_FILE="Formula/breeze.rb"
          if [ -f "$FORMULA_FILE" ]; then
            git rm "$FORMULA_FILE"
            echo "已自动删除无用的占位文件: $FORMULA_FILE"
          fi

      - name: 提交并推送到 Homebrew
        working-directory: ./homebrew-Breeze
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "没有需要提交的变更，跳过推送。"
            exit 0
          fi
          git commit -m "Update macOS Cask to ${{ needs.preflight.outputs.version }} and clean up placeholders"
          git push
