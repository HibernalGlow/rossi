<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="title desc">
  <title id="title">Rossi — a cross-platform manga reader</title>
  <desc id="desc">A washi-paper card: on the left the Rossi wordmark, a bilingual one-line pitch and the Material 3 Expressive / workspace credits; on the right the wine-red cat mask from the app icon resting on a shelf line, its hollow eye panels revealing manga gutters behind it.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1EA"/>
      <stop offset="1" stop-color="#E7DFD3"/>
    </linearGradient>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9C4B5E"/>
    </marker>
  </defs>

  <rect width="1200" height="440" rx="26" fill="url(#paper)"/>


  <!-- 漫画分格线：面具的眼眶是镂空的，所以这两条线会正好从眼睛里透出来 -->
  <g stroke="#CFC5B7" stroke-width="2" opacity="0.5">
    <line x1="979" y1="150" x2="979" y2="392"/>
    <line x1="1069" y1="150" x2="1069" y2="392"/>
  </g>

  <!-- 应用图标真身，path 数据原样取自 poc/mask-upright.svg，未重绘 -->
  <g transform="translate(730.79 173.34) scale(0.52)">
    <path fill="#9C4B5E" fill-rule="evenodd" d="M 69.89,412.80 C 52.57,402.92 38.15,384.62 33.10,350.38 C 25.84,301.47 46.33,259.52 82.49,228.78 C 108.48,203.59 142.40,185.60 172.80,185.60 L 403.36,185.60 L 496.51,32.00 L 578.98,185.60 L 675.42,32.00 C 711.57,127.45 743.51,205.32 761.88,274.57 C 778.08,326.72 756.63,375.63 730.08,412.80 Z M 429.13,237.41 L 537.20,323.82 C 534.10,342.39 525.06,355.78 507.11,361.76 C 474.06,373.93 444.97,363.73 428.51,336.24 C 417.77,318.50 416.70,277.09 429.13,237.41 Z M 591.75,329.47 L 696.56,246.02 C 707.80,274.26 708.70,310.21 693.80,338.80 C 680.41,364.35 655.99,378.17 633.01,372.73 C 615.68,368.42 602.28,351.78 591.75,329.47 Z"/>
  </g>

  <line x1="64" y1="392" x2="1136" y2="392" stroke="#CFC5B7" stroke-width="2"/>

  <text x="64" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3.2" fill="#8A7A66">FLUTTER + RUST · MATERIAL 3 EXPRESSIVE</text>
  <text x="64" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="116" font-weight="700" letter-spacing="-2" fill="#9C4B5E">Rossi</text>
  <rect x="64" y="240" width="84" height="6" rx="3" fill="#762D3F"/>
  <text x="64" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="30" fill="#2A2320">Any third-party comic source, one shared bookshelf.</text>
  <text x="64" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="21" fill-opacity="0.78" fill="#2A2320">把任意第三方图源，装进同一个书架。</text>

  <text x="64" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="18" fill="#8A7A66">Source plugins · Workspace lanes · Local &amp; cloud favourites · Upscaling · Page translation · Video pages</text>
  <text x="64" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8A7A66">Android · iOS · Windows · macOS · Linux</text>
  <text x="1136" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" text-anchor="end" fill="#8A7A66">MPL-2.0</text>

</svg>
