<!-- mirror of ocr-translate.svg — same geometry and palette, English copy only. Keep in sync. -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="title desc">
  <title id="title">Rossi manga translation pipeline (finished pages)</title>
  <desc id="desc">Six steps: detect text boxes with PP-OCRv4 det, recognize speech with manga-ocr, erase the original
  text with LaMa, translate with one of three engines, re-typeset into the speech bubbles with LXGW WenKai, and emit a
  finished page that the reader toggles per page. Below, the three translation engines, and a note that this is
  currently Windows, Linux and macOS only.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1EA"/>
      <stop offset="1" stop-color="#E7DFD3"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9C4B5E"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="26" fill="url(#paper)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="64" y="78" font-size="34" font-weight="700" fill="#2A2320">Not subtitles — a redrawn page</text>
    <text x="1136" y="78" font-size="19" text-anchor="end" fill="#8A7A66"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">finished page</text>
    <rect x="64" y="94" width="56" height="5" rx="2.5" fill="#762D3F"/>

    <!-- six steps -->
    <g id="steps">
      <g transform="translate(64 140)">
        <rect width="156" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
        <text x="16" y="30" font-size="18" fill="#8A7A66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
        <text x="16" y="62" font-size="21" fill="#2A2320">Detect</text>
        <text x="16" y="88" font-size="18" fill="#8A7A66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PP-OCRv4 det</text>
      </g>
      <line x1="224" y1="195" x2="238" y2="195" stroke="#9C4B5E" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(244 140)">
        <rect width="156" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
        <text x="16" y="30" font-size="18" fill="#8A7A66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
        <text x="16" y="62" font-size="21" fill="#2A2320">Recognize</text>
        <text x="16" y="88" font-size="18" fill="#8A7A66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">manga-ocr</text>
      </g>
      <line x1="404" y1="195" x2="418" y2="195" stroke="#9C4B5E" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(424 140)">
        <rect width="156" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
        <text x="16" y="30" font-size="18" fill="#8A7A66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03</text>
        <text x="16" y="62" font-size="21" fill="#2A2320">Erase text</text>
        <text x="16" y="88" font-size="18" fill="#8A7A66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LaMa</text>
      </g>
      <line x1="584" y1="195" x2="598" y2="195" stroke="#9C4B5E" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(604 140)">
        <rect width="156" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
        <text x="16" y="30" font-size="18" fill="#8A7A66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04</text>
        <text x="16" y="62" font-size="21" fill="#2A2320">Translate</text>
        <text x="16" y="88" font-size="18" fill="#8A7A66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3 engines</text>
      </g>
      <line x1="764" y1="195" x2="778" y2="195" stroke="#9C4B5E" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(784 140)">
        <rect width="156" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
        <text x="16" y="30" font-size="18" fill="#8A7A66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">05</text>
        <text x="16" y="62" font-size="21" fill="#2A2320">Re-typeset</text>
        <text x="16" y="88" font-size="18" fill="#8A7A66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LXGW WenKai</text>
      </g>
      <line x1="944" y1="195" x2="958" y2="195" stroke="#9C4B5E" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(964 140)">
        <rect width="156" height="110" rx="14" fill="#9C4B5E" fill-opacity="0.1" stroke="#9C4B5E" stroke-width="1.5"/>
        <text x="16" y="30" font-size="18" fill="#762D3F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">06</text>
        <text x="16" y="62" font-size="21" font-weight="600" fill="#762D3F">Finished</text>
        <text x="16" y="88" font-size="18" fill="#762D3F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Toggle chip</text>
      </g>
    </g>

    <line x1="64" y1="282" x2="1136" y2="282" stroke="#CFC5B7" stroke-width="1.5"/>
    <text x="64" y="314" font-size="19" fill="#8A7A66"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Where the translation comes from · your choice</text>

    <g id="engines">
      <g transform="translate(64 328)">
        <rect width="340" height="66" rx="14" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
        <text x="18" y="28" font-size="21" fill="#2A2320">API endpoint</text>
        <text x="18" y="52" font-size="18" fill="#8A7A66">Cloud or local Ollama · glossary</text>
      </g>
      <g transform="translate(430 328)">
        <rect width="340" height="66" rx="14" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
        <text x="18" y="28" font-size="21" fill="#2A2320">Hunyuan Hy-MT2</text>
        <text x="18" y="52" font-size="18" fill="#8A7A66">Local llama-server · glossary</text>
      </g>
      <g transform="translate(796 328)">
        <rect width="340" height="66" rx="14" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
        <text x="18" y="28" font-size="21" fill="#2A2320">Apple translation</text>
        <text x="18" y="52" font-size="18" fill="#8A7A66">On-device, free · no glossary</text>
      </g>
    </g>

    <text x="64" y="440" font-size="19" fill="#2A2320">Desktop only today: Windows / Linux / macOS.</text>
    <text x="64" y="472" font-size="19" fill="#8A7A66">Android and iOS are excluded on purpose, not on the backlog: the recognizer is an fp32 ViT + BERT.</text>
  </g>
</svg>
