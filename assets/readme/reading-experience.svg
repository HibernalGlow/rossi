<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="640" viewBox="0 0 1200 640"
     role="img" aria-labelledby="title desc">
  <title id="title">六种读法，同一套手势</title>
  <desc id="desc">六格示意图：从右到左、从左到右、条漫纵向、双页无缝、横长页分割、自动滚动。底部补充放大镜、手动页序、幻灯片、章节已读与轮盘等新工具。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1EA"/>
      <stop offset="1" stop-color="#E7DFD3"/>
    </linearGradient>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9C4B5E"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="26" fill="url(#paper)"/>

<text x="64" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#2A2320">六种读法，同一套手势</text><text x="1136" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" text-anchor="end" fill="#8A7A66">reading direction</text><rect x="64" y="94" width="56" height="5" rx="2.5" fill="#762D3F"/>
  <rect x="64" y="146" width="336" height="150" rx="18" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
  <rect x="90" y="188" width="36" height="48" rx="4" fill="#9C4B5E" fill-opacity="0.14" stroke="#CFC5B7" stroke-width="1.4"/><line x1="96" y1="212" x2="120" y2="212" stroke="#CFC5B7" stroke-width="1.4"/>
  <rect x="136" y="188" width="36" height="48" rx="4" fill="#FFFFFF" fill-opacity="0.9" stroke="#CFC5B7" stroke-width="1.4"/><line x1="142" y1="212" x2="166" y2="212" stroke="#CFC5B7" stroke-width="1.4"/>
  <line x1="160" y1="176" x2="106" y2="176" stroke="#9C4B5E" stroke-width="2" marker-end="url(#arrowhead)" stroke-linecap="round"/>
  <text x="196" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#2A2320">从右到左</text>
  <text x="90" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8A7A66">日漫原样，不需要镜像</text>
  <rect x="432" y="146" width="336" height="150" rx="18" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
  <rect x="458" y="188" width="36" height="48" rx="4" fill="#FFFFFF" fill-opacity="0.9" stroke="#CFC5B7" stroke-width="1.4"/><line x1="464" y1="212" x2="488" y2="212" stroke="#CFC5B7" stroke-width="1.4"/>
  <rect x="504" y="188" width="36" height="48" rx="4" fill="#9C4B5E" fill-opacity="0.14" stroke="#CFC5B7" stroke-width="1.4"/><line x1="510" y1="212" x2="534" y2="212" stroke="#CFC5B7" stroke-width="1.4"/>
  <line x1="474" y1="176" x2="528" y2="176" stroke="#9C4B5E" stroke-width="2" marker-end="url(#arrowhead)" stroke-linecap="round"/>
  <text x="564" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#2A2320">从左到右</text>
  <text x="458" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8A7A66">国漫与译制版走这一档</text>
  <rect x="800" y="146" width="336" height="150" rx="18" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
  <rect x="840" y="170" width="44" height="76" rx="4" fill="#FFFFFF" fill-opacity="0.9" stroke="#CFC5B7" stroke-width="1.4"/><line x1="846" y1="189" x2="878" y2="189" stroke="#CFC5B7" stroke-width="1.4"/><line x1="846" y1="208" x2="878" y2="208" stroke="#CFC5B7" stroke-width="1.4"/><line x1="846" y1="227" x2="878" y2="227" stroke="#CFC5B7" stroke-width="1.4"/>
  <line x1="900" y1="178" x2="900" y2="236" stroke="#9C4B5E" stroke-width="2" marker-end="url(#arrowhead)" stroke-linecap="round"/>
  <text x="932" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#2A2320">条漫连读</text>
  <text x="826" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8A7A66">从上到下滚动，也能点击翻页</text>
  <rect x="64" y="320" width="336" height="150" rx="18" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
  <rect x="90" y="362" width="41" height="48" rx="4" fill="#9C4B5E" fill-opacity="0.14" stroke="#CFC5B7" stroke-width="1.4"/><line x1="96" y1="386" x2="125" y2="386" stroke="#CFC5B7" stroke-width="1.4"/>
  <rect x="131" y="362" width="41" height="48" rx="4" fill="#9C4B5E" fill-opacity="0.14" stroke="#CFC5B7" stroke-width="1.4"/><line x1="137" y1="386" x2="166" y2="386" stroke="#CFC5B7" stroke-width="1.4"/>
  <line x1="131" y1="356" x2="131" y2="416" stroke="#762D3F" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="196" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#2A2320">双页无缝</text>
  <text x="90" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8A7A66">左右各占一半，消掉中缝留白</text>
  <rect x="432" y="320" width="336" height="150" rx="18" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
  <rect x="458" y="358" width="86" height="40" rx="4" fill="#FFFFFF" fill-opacity="0.9" stroke="#CFC5B7" stroke-width="1.4"/>
  <line x1="501" y1="352" x2="501" y2="404" stroke="#9C4B5E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="496" y1="342" x2="470" y2="342" stroke="#9C4B5E" stroke-width="2" marker-end="url(#arrowhead)" stroke-linecap="round"/>
  <line x1="506" y1="342" x2="532" y2="342" stroke="#9C4B5E" stroke-width="2" marker-end="url(#arrowhead)" stroke-linecap="round"/>
  <text x="564" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#2A2320">横长页分割</text>
  <text x="458" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8A7A66">跨页大图切成左右两半读</text>
  <rect x="800" y="320" width="336" height="150" rx="18" fill="#FFFFFF" fill-opacity="0.42" stroke="#CFC5B7" stroke-width="1.5"/>
  <rect x="840" y="344" width="44" height="76" rx="4" fill="#FFFFFF" fill-opacity="0.9" stroke="#CFC5B7" stroke-width="1.4"/><line x1="846" y1="363" x2="878" y2="363" stroke="#CFC5B7" stroke-width="1.4"/><line x1="846" y1="382" x2="878" y2="382" stroke="#CFC5B7" stroke-width="1.4"/><line x1="846" y1="401" x2="878" y2="401" stroke="#CFC5B7" stroke-width="1.4"/>
  <line x1="846" y1="358" x2="878" y2="358" stroke="#9C4B5E" stroke-width="2"/>
  <line x1="846" y1="382" x2="878" y2="382" stroke="#9C4B5E" stroke-width="2"/>
  <line x1="846" y1="406" x2="878" y2="406" stroke="#9C4B5E" stroke-width="2"/>
  <line x1="900" y1="352" x2="900" y2="410" stroke="#9C4B5E" stroke-width="2" marker-end="url(#arrowhead)" stroke-linecap="round"/>
  <text x="932" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#2A2320">自动滚动</text>
  <text x="826" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" fill="#8A7A66">间隔与距离可调，含墨水屏优化</text>
  <line x1="64" y1="512" x2="1136" y2="512" stroke="#CFC5B7" stroke-width="1.5"/>
  <text x="64" y="544" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8A7A66">ALSO IN THE READER</text>
  <rect x="64" y="558" width="106" height="30" rx="15" fill="#2A2320" fill-opacity="0.06"/><text x="117" y="578.76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" fill="#2A2320">页面放大镜</text>
  <rect x="178" y="558" width="90" height="30" rx="15" fill="#2A2320" fill-opacity="0.06"/><text x="223" y="578.76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" fill="#2A2320">手动页序</text>
  <rect x="276" y="558" width="138" height="30" rx="15" fill="#2A2320" fill-opacity="0.06"/><text x="345" y="578.76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" fill="#2A2320">幻灯片自动翻页</text>
  <rect x="422" y="558" width="122" height="30" rx="15" fill="#2A2320" fill-opacity="0.06"/><text x="483" y="578.76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" fill="#2A2320">章节已读标记</text>
  <rect x="552" y="558" width="90" height="30" rx="15" fill="#2A2320" fill-opacity="0.06"/><text x="597" y="578.76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" fill="#2A2320">径向轮盘</text>
  <text x="64" y="618" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="17" fill="#8A7A66">以上每一项都能只对当前这本生效；桌面端键盘、鼠标、侧键、滚轮、手柄、触屏的绑定全部可改。</text>
</svg>
