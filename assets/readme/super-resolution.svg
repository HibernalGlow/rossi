  <title id="title">四条超分路线</title>
  <desc id="desc">左侧是糊掉的网点与恢复后的网点对比；右侧列出四条超分路线及其适用平台矩阵，打勾表示这条路线在该平台上真的能跑。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1EA"/>
      <stop offset="1" stop-color="#E7DFD3"/>
    </linearGradient>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9C4B5E"/>
    </marker>
  </defs>

  <rect width="1200" height="658" rx="26" fill="url(#paper)"/>

