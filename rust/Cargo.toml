# rust/ 同时是「windcore 这个包」和「workspace 根」。
#
# 为什么不让 windcore 挪进 rust/windcore/：Flutter 侧的 native-assets 构建钩子
# (`hook/build.dart` → `native_toolchain_rust`)、FRB 配置 (`flutter_rust_bridge.yaml`
# 的 `rust_root: rust/`) 以及各平台工程都按「`rust/Cargo.toml` 就是 windcore」来定位。
# 保留根包 + 显式 default-members = ["."] 可以让 `cargo build`（无论谁来调）仍只构建
# windcore，新增成员不改变既有构建语义。
[workspace]
resolver = "3"
# `gpu_present` 是 Windows 专用的呈现器（wgpu → DXGI 共享纹理 → Flutter 合成），
# 产物是独立的 `rossi_gpu_present.dll`，由 C++ runner 用 LoadLibrary 加载。
# 它**不在** default-members 里，所以 `cargo build` / `cargo test` 仍然只碰 windcore；
# Flutter 的 native-assets hook 也显式带 `--package windcore`，不会被连带构建。
members = ["operation_binding_core", "local_core", "gpu_present", "ocr_core"]
default-members = ["."]

[package]
name = "windcore"
version = "0.1.0"
edition = "2024"

[lib]
name = "windcore"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# 本地漫画核心（散图文件夹 / CBZ / CBR 直读，v0.1 判据 A）。
# 独立 crate：默认构建仍只构建 windcore 本身，但 windcore 现在**在依赖图上**包含它，
# 因此 Flutter 侧产物会带上 RAR（unrar-patched）与 image 的多格式 feature 集。
#
# `default-features = false`：JXL 后端由**本包的 [features]** 决定（见下），
# 不吃 local_core 自己的 default —— 切换后端只改这里的 default 一行重编即可。
# avif 显式列出（dav1d，ADR 同 §12.6）。
rossi_local_core = { path = "local_core", default-features = false, features = [
    "avif",
] }
# OCR 链路（ADR-0018）：检测 / 识别 / 聚块 / 擦字。与 local_core 一样是独立 crate，
# 但 windcore 在依赖图上包含它 —— 页面分析要过 FRB 给 Dart。
# 注意：它自己也依赖 ort，且三段 cfg 的特性集必须与本文件的三段**逐字一致**
# （ort-sys 选预编译发行包时要求特性集精确相等，不匹配会在链接期才炸）。
rossi_ocr_core = { path = "ocr_core" }
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
md5 = "0.8.0"
base64 = "0.22.1"
log = "0.4.33"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-log = "0.2"
tracing-appender = "0.2.5"
env_logger = "0.11.10"
anyhow = "1.0.102"
dashmap = "6.1.0"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "http2",
    "json",
    "query",
    "stream",
    "charset",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "cookies",
    "multipart",
    "rustls",
    "system-proxy",
    "socks",
] }
reqwest-middleware = { version = "0.5.2", features = [
    "form",
    "json",
    "multipart",
    "query",
] }
reqwest_dav = "0.3.3"
url = "2.5.8"
tokio-tar = "0.3.1"
zip = { version = "8.2.0", default-features = false, features = [
    "deflate",
    "time",
] }
zhconv = "0.4.1"
lazy_static = "1.5.0"
flate2 = "1.1.9"
zstd = "0.13.3"
rquickjs_playground = { path = "rquickjs_playground" }
chrono = "0.4.45"
iana-time-zone = "0.1.61"
sys-locale = "0.3.2"
tz-rs = "0.7.3"
icu_locale = { version = "2.2.0", features = ["compiled_data"] }
icu_time = "2.2.0"
terminal_size = "0.4.4"
# 系统已安装字体家族枚举（字体设置页「系统已装字体」档的选择器数据源）。
# 按目标平台走原生字体库：macOS/iOS = CoreText，Windows = DirectWrite，Linux = fontconfig。
# 只开 `source`（枚举），不拉 freetype loader，省掉 Linux 构建的 freetype 依赖。
ferrous-opencc = { version = "0.4.0", features = ["japanese-conversion"] }
brotli = "8.0.4"
sevenz-rust = "0.6.1"
webp = "0.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde-xml-rs = "0.8.2"
ciborium = "0.2.2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
# mImageViewer 同款 ONNX 推理。macOS/iOS 优先 CoreML（Apple Silicon
# Neural Engine + GPU），其他平台回退到 ONNX Runtime CPU。
# `coreml` 的按目标拆分见下方两个 `[target.*]` 段。
ndarray = "0.17"

[target.'cfg(not(target_os = "android"))'.dependencies]
# 安卓不用 font-kit：它在 Rust 里同为 target_os="linux"，会去要 bionic 根本不存在的
# fontconfig（CI 上的表现是 dav1d 修好之后改红在 yeslogic-fontconfig-sys 的 build script）。
# 安卓走下面的目录扫描，见 rust/src/api/font.rs 的模块注释。
font-kit = { version = "0.14", default-features = false, features = ["source"] }

[dev-dependencies]
# 只给 `api::local` 的会话层测试造 CBZ 夹具用。
tempfile = "3"

[features]
# JXL 后端编译期开关（透传给 rossi_local_core，后端对照表见 local_core/src/jxl_backend.rs）。
# **切换 = 改 default 里的名字 + 重编**；三个 feature 可叠加，叠加时运行时按
# 固定优先级取第一个（jxl-rs-mt > jxl-rs-1t > jxl-oxide）。
# 实测（docs/v0.1-local-core.md §12.8，44.8 MPix 页全尺寸解码）：
#   jxl-rs-mt 91ms（全场最快，比 dav1d 快 1.6×） / jxl-rs-1t 563ms / jxl-oxide 937ms。
default = ["jxl-rs-mt"]
jxl-rs-mt = ["rossi_local_core/jxl-rs-mt"]  # jxl 0.7 纯 Rust（libjxl 官方重写，BSD-3）+ rayon 全核
jxl-rs-1t = ["rossi_local_core/jxl-rs-1t"]  # 同上，官方 image hook，单线程
jxl-oxide = ["rossi_local_core/jxl-oxide"]  # jxl-oxide 0.12 纯 Rust，慢约 10×，只作对照
host-fronting = ["rquickjs_playground/host-fronting"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
tracing-logcat = "0.1.0"
jni = "0.22.4"
rustls-platform-verifier = "0.7.0"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
oslog = "0.2.0"
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "coreml",
    "download-binaries",
    "tls-rustls",
] }

# `ort` 按目标拆成三段、且三段 cfg 互斥，因为 ort-sys 选预编译发行包的条件是
# 「特性集与该发行**精确相等**」：
#   - aarch64-apple-darwin / ios：只有含 coreml 的条目
#   - x86_64-pc-windows-msvc：只有 directml / webgpu / cuda13… ，没有含 coreml 的
#   - 其余（linux / android）：没有 directml，特性集必须留空
# 特性集匹配不上时 build script 只打一行
# `looking for prebuilt binaries matching feature set: …` 的 debug 日志就返回，
# 不报错；真症状推迟到链接期 —— `LNK2019: unresolved external symbol OrtGetApiBase`。
# 三段各自实测过：Apple `feature set: coreml` 并链接 CoreML framework，
# Windows `(no features)` 命中 directml 发行，加 directml 后与之精确相等。
# 三段的 cfg 两两互斥，Windows 那段单独列出来：合并语义未经验证，不赌。
[target.'cfg(not(any(target_os = "ios", target_os = "macos", target_os = "windows")))'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-rustls",
] }

# Windows 走 DirectML EP（GPU）。发行包本来就是 directml 那条，特性集写上它才算精确匹配。
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "directml",
    "download-binaries",
    "tls-rustls",
] }

[build-dependencies]
ureq = "3.3.0"

[profile.dev]
# 关闭调试符号生成
debug = 0

# 减少中间产物
opt-level = 1

# 减少增量编译生成的碎片文件
incremental = true

[patch.crates-io]
# quickjs-ng 0.15.1 + 安全/性能补丁，补丁清单见 fork 仓库的 PATCHES.md。
rquickjs-sys = { git = "https://github.com/deretame/breeze-rquickjs-sys", rev = "846889c482ee7511f558595384673f55c00c9f4a" }
