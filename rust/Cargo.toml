# rust/ 同时是「windcore 这个包」和「workspace 根」。
#
# 为什么不让 windcore 挪进 rust/windcore/：Flutter 侧的 native-assets 构建钩子
# (`hook/build.dart` → `native_toolchain_rust`)、FRB 配置 (`flutter_rust_bridge.yaml`
# 的 `rust_root: rust/`) 以及各平台工程都按「`rust/Cargo.toml` 就是 windcore」来定位。
# 保留根包 + 显式 default-members = ["."] 可以让 `cargo build`（无论谁来调）仍只构建
# windcore，新增成员不改变既有构建语义。
[workspace]
resolver = "3"
members = ["local_core"]
default-members = ["."]

[package]
name = "windcore"
version = "0.1.0"
edition = "2024"

[lib]
name = "windcore"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# 本地漫画核心（散图文件夹 / CBZ / CBR 直读，v0.1 判据 A）。
# 独立 crate：默认构建仍只构建 windcore 本身，但 windcore 现在**在依赖图上**包含它，
# 因此 Flutter 侧产物会带上 RAR（unrar-patched）与 image 的多格式 feature 集。
#
# `default-features = false`：JXL 后端由**本包的 [features]** 决定（见下），
# 不吃 local_core 自己的 default —— 切换后端只改这里的 default 一行重编即可。
# avif 显式列出（dav1d，ADR 同 §12.6）。
rossi_local_core = { path = "local_core", default-features = false, features = [
    "avif",
] }
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
md5 = "0.8.0"
base64 = "0.22.1"
log = "0.4.33"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-log = "0.2"
tracing-appender = "0.2.5"
env_logger = "0.11.10"
anyhow = "1.0.102"
dashmap = "6.1.0"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "http2",
    "json",
    "query",
    "stream",
    "charset",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "cookies",
    "multipart",
    "rustls",
    "system-proxy",
    "socks",
] }
reqwest-middleware = { version = "0.5.2", features = [
    "form",
    "json",
    "multipart",
    "query",
] }
reqwest_dav = "0.3.3"
url = "2.5.8"
tokio-tar = "0.3.1"
zip = { version = "8.2.0", default-features = false, features = [
    "deflate",
    "time",
] }
zhconv = "0.4.1"
lazy_static = "1.5.0"
flate2 = "1.1.9"
zstd = "0.13.3"
rquickjs_playground = { path = "rquickjs_playground" }
chrono = "0.4.45"
iana-time-zone = "0.1.61"
sys-locale = "0.3.2"
tz-rs = "0.7.3"
icu_locale = { version = "2.2.0", features = ["compiled_data"] }
icu_time = "2.2.0"
terminal_size = "0.4.4"
ferrous-opencc = { version = "0.4.0", features = ["japanese-conversion"] }
brotli = "8.0.4"
sevenz-rust = "0.6.1"
webp = "0.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde-xml-rs = "0.8.2"
ciborium = "0.2.2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[dev-dependencies]
# 只给 `api::local` 的会话层测试造 CBZ 夹具用。
tempfile = "3"

[features]
# JXL 后端编译期开关（透传给 rossi_local_core，后端对照表见 local_core/src/jxl_backend.rs）。
# **切换 = 改 default 里的名字 + 重编**；三个 feature 可叠加，叠加时运行时按
# 固定优先级取第一个（jxl-rs-mt > jxl-rs-1t > jxl-oxide）。
# 实测（docs/v0.1-local-core.md §12.8，44.8 MPix 页全尺寸解码）：
#   jxl-rs-mt 91ms（全场最快，比 dav1d 快 1.6×） / jxl-rs-1t 563ms / jxl-oxide 937ms。
default = ["jxl-rs-mt"]
jxl-rs-mt = ["rossi_local_core/jxl-rs-mt"]  # jxl 0.7 纯 Rust（libjxl 官方重写，BSD-3）+ rayon 全核
jxl-rs-1t = ["rossi_local_core/jxl-rs-1t"]  # 同上，官方 image hook，单线程
jxl-oxide = ["rossi_local_core/jxl-oxide"]  # jxl-oxide 0.12 纯 Rust，慢约 10×，只作对照

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
tracing-logcat = "0.1.0"
jni = "0.22.4"
rustls-platform-verifier = "0.7.0"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
oslog = "0.2.0"

[build-dependencies]
ureq = "3.3.0"

[profile.dev]
# 关闭调试符号生成
debug = 0

# 减少中间产物
opt-level = 1

# 减少增量编译生成的碎片文件
incremental = true

# 单独给 `image` 提优化级别。
#
# 为什么只给这一个 crate：本地来源（判据 A）的翻页路径上有一段
# `DynamicImage::thumbnail_exact` 的降采样 —— 44.8 MPix 的页降到显示尺寸，
# 它的实例化发生在 `image` **内部**，因此吃的是 `image` 自己的 opt-level。
# `[profile.dev]` 的 opt-level = 1 下这段实测约 227 ms（降到 768 px），
# 而它是本地来源显示路径里仅次于 dav1d 解码的第二大项。
#
# 不直接抬 `[profile.dev].opt-level`：那会让整个增量构建变慢，
# 而这个项目的日常就是热重载。release 构建本来就是 opt-level 3，不受影响。
[profile.dev.package.image]
opt-level = 3

# 临时 patch：rquickjs-sys 0.12.0 在 Windows 交叉编译 Android 时，
# host 构建会错误使用 Android NDK 的 libclang 生成绑定，导致 JSValue 类型不匹配。
# 详见：https://github.com/DelSkayn/rquickjs/issues/709
# jpegxl-src 本地补丁：上游硬编码 `.generator_toolset("ClangCL")`，本机 VS BuildTools
# 没装 ClangCL 组件（MSB8020），删掉该行回落默认 MSVC。补丁副本在仓库外
# `D:/1Dev/vendor/jpegxl-src-0.12.0`（**本地路径，未随仓库分发**）——只在开
# `jxl-probe-libjxl`（探针对照量 JXL 用，GPL）时进入依赖图；不开此 feature 的机器
# 不受影响。若要在别的机器复现：拷 registry 里的 jpegxl-src-0.12.0、删 lib.rs:93 一行即可。
[patch.crates-io]
jpegxl-src = { path = "D:/1Dev/vendor/jpegxl-src-0.12.0/jpegxl-src-0.12.0" }
rquickjs-sys = { git = "https://github.com/deretame/rquickjs.git", branch = "fix/android-windows-bindgen" }
