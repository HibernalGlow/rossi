[package]
name = "rossi_local_core"
version = "0.1.0"
edition = "2024"
description = "Rossi 本地漫画核心：散图文件夹 / CBZ / CBR 的直读（v0.1 判据 A）"
license = "MIT"

[dependencies]
anyhow = "1"
# 与 windcore 同版本同特性集：两处都是 0.25.10，feature 合并后不会出现双份编译。
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "bmp",
    "gif",
    "tiff",
] }
zune-jpeg = "0.5"
zune-core = "0.5"
# 与 windcore 同版本（8.2.0），避免 Cargo 同时编译 zip 8 与 zip 2（见 v0.1_acceptance §4.4）。
zip = { version = "8.2.0", default-features = false, features = [
    "deflate",
    "time",
] }
# RAR 直读沿用 mImageViewer 打过补丁的 0.5.8（ADR-0011 §6）。
# 该 crate 在 vendor 检出里被其 workspace `exclude`，本身就是独立可用的包。
# 补丁内容：UCM_CHANGEVOLUMEW 回调不再按固定 2048 长度切片读变长分卷名。
unrar = { path = "../../vendor/mimageviewer/crates/unrar-patched" }
# ---- JXL 后端（编译期可切换，见 src/jxl_backend.rs 的对照表）----
# 后端一（**App 默认**）：jxl-rs 多线程直连。`jxl` 0.7 = libjxl 官方组织的纯 Rust
# 解码器（Chrome 145 / Firefox 采用中），BSD-3-Clause，默认 SIMD（avx/avx512/sse42
# 运行时分发）。注意与 jxl-oxide 是完全不同的项目。官方 image 集成把 parallel_runner
# 硬编码成 None，多线程必须 jxl::api 直连 + 自带 rayon runner（§12.8 实测全场最快）。
jxl = { version = "0.7", optional = true }
rayon = { version = "1", optional = true }
# 后端二（对照/回退）：jxl-rs 官方 image hook，单线程（hook 硬编码 parallel_runner=None）。
jxl-image-rs-integration = { version = "0.7", optional = true, default-features = false, features = [
    "all-simd",
] }
# 后端三（对照）：jxl-oxide 0.12 纯 Rust，比 jxl-rs 慢约 10×（§12.7），只留作切换对照。
jxl-oxide = { version = "0.12", optional = true, default-features = false, features = [
    "rayon",
    "image",
] }
# 第四种「后端」（仅探针）：jpegxl-rs 0.15 = libjxl 0.12 官方 C 库的安全封装。
# **License 是 GPL-3.0-or-later**（crates.io 全版本核实）——只允许进探针这种不分发的
# dev 工具，绝不能进 local_core/App（MIT）。真要吃 libjxl 得自写 BSD 侧薄 FFI 或进程隔离。
jpegxl-rs = { version = "0.15", optional = true, default-features = false, features = [
    "image",
    "vendored",
] }

# ── 仅 Windows 需要的依赖 ──
# 只给 `src/file_tree.rs` 的 `get_available_roots()` 枚举本机盘符用：
# `GetLogicalDrives` / `GetDriveTypeW` 在 wind32 API 里没有 std 等价物，
# 自己拼 `A:\`…`Z:\` 再 `is_dir()` 探测会把光驱/未就绪的卷判成「存在」。
# 版本与 `gpu_present` 保持一致（0.58），feature 合并后不会出现双份编译。
# 非 Windows 平台这段不参与构建，file_tree.rs 的对应分支由 cfg 门关掉。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[features]
# AVIF 解码。
#
# 开（默认）：image 的 `avif-native`（dav1d + mp4parse），归档里的 avif 能真正解出像素。
#   代价有两处，都写在这里免得后来人意外：
#   - **构建时**要求 pkg-config 找得到 dav1d（Windows 见 docs/windows-build/README.md，
#     macOS `brew install dav1d`，Linux `apt install libdav1d-dev`）。
#   - **运行时**要求 dav1d.dll 随 App 分发（BSD-2-Clause，可自由分发）。
# 关：退回「avif 只算页、不解码」的旧行为，给没有 dav1d 的构建机留一条不阻塞的路：
#   `cargo build -p rossi_local_core --no-default-features`，
#   或在依赖方写 `rossi_local_core = { path = ..., default-features = false }`。
#
# 注意 Cargo 的 feature 合并：`windcore` 依赖的是**同一份** image 0.25.10，
# 所以 local_core 打开这个 feature，**Flutter App 的 Rust 侧构建同样会需要 dav1d**。
# 这不是意外，是同一份依赖；要分开得靠依赖方显式 `default-features = false`。
#
# JXL 默认开 `jxl-rs-mt`（§12.8 实测全场最快、BSD-3、零 C 构建依赖）。
# 切换后端 = 改 default 里的 feature 名重编；三个后端可叠加，叠加时
# `jxl_backend::decode_dispatch` 按固定优先级（mt > 1t > oxide）取第一个。
default = ["avif", "jxl-rs-mt"]
avif = ["image/avif-native"]
# JXL 后端三选一（可叠加）：详见 src/jxl_backend.rs 头注释的对照表。
jxl-rs-mt = ["dep:jxl", "dep:rayon"]
jxl-rs-1t = ["dep:jxl-image-rs-integration"]
jxl-oxide = ["dep:jxl-oxide"]
# 只开给 scale_probe：`cargo build -p rossi_local_core --bin scale_probe --features jxl-probe`
# 三个纯 Rust 后端全开，`--jxl-backend` 运行时切换；GPL 的 libjxl 走 jxl-probe-libjxl。
jxl-probe = ["jxl-rs-mt", "jxl-rs-1t", "jxl-oxide"]
# libjxl 后端对照：`--features jxl-probe,jxl-probe-libjxl`，探针 `--jxl-backend libjxl` 切换
jxl-probe-libjxl = ["dep:jpegxl-rs"]

[dev-dependencies]
tempfile = "3"
# 只给测试用：RAR 夹具是 mImageViewer 源码里内嵌的 base64 块（见 rar_source.rs 的注释）。
base64 = "0.22"
